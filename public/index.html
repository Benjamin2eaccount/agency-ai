<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agency AI</title>

  <!-- Favicon + PWA -->
  <link rel="icon" href="/images/agency_ai_logo_dark.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/agency_ai_logo_dark.png">
  <!-- OG / Twitter cards -->
  <meta property="og:image" content="https://www.agencyai.info/images/banner.png">
  <meta property="og:logo" content="https://www.agencyai.info/images/agency_ai_logo_dark.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.agencyai.info/images/banner.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agency AI">
  <meta name="theme-color" content="#111111">

  <!-- Apply dark theme before render to prevent flash -->
  <script>
    (function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Sortable.js (Task 15 — drag-and-drop pipeline) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <!-- canvas-confetti (Task 8) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ── Topbar ─────────────────────────────────────────────────── -->
  <div class="topbar" id="topbar">
    <div class="topbar-breadcrumb">
      <span>Werkruimte</span>
      <span class="topbar-sep">›</span>
      <span>Agency AI</span>
      <span class="topbar-sep">›</span>
      <span id="topbarPage" class="topbar-current">Dashboard</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-status"><span class="status-dot-green"></span> systeem online</span>
      <span id="topbarTime" class="topbar-time"></span>
    </div>
  </div>

  <!-- ── Sidebar (desktop) ─────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <img src="/images/agency_ai_logo_dark.png" alt="Agency AI" style="height:28px;max-width:120px;object-fit:contain;display:block">
        </div>
        <span class="logo-name">Agency AI</span>
      </div>
      <button class="notif-btn" id="notifBtn" title="Meldingen">
        <i class="ti ti-bell"></i>
        <span class="notif-badge" id="notifBadge" style="display:none">0</span>
      </button>
    </div>


    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Werkruimte</div>
      <a href="#" class="nav-item" data-view="dashboard">
        <i class="ti ti-layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-view="inbox">
        <i class="ti ti-inbox"></i>
        <span>Inbox</span>
        <span class="nav-badge" id="inboxBadge" style="display:none"></span>
      </a>
      <a href="#" class="nav-item" data-view="leads">
        <i class="ti ti-users"></i>
        <span>Leads</span>
      </a>
      <a href="#" class="nav-item" data-view="pipeline">
        <i class="ti ti-git-branch"></i>
        <span>Pipeline</span>
        <span class="nav-badge" id="pipelineBadge" style="display:none"></span>
      </a>
      <a href="#" class="nav-item" data-view="agents">
        <i class="ti ti-robot"></i>
        <span>Agents</span>
      </a>
      <a href="#" class="nav-item" data-view="runs">
        <i class="ti ti-rotate-clockwise"></i>
        <span>Runs</span>
      </a>
      <a href="#" class="nav-item" data-view="stats">
        <i class="ti ti-chart-bar"></i>
        <span>Statistieken</span>
      </a>
      <a href="#" class="nav-item" data-view="betalingen" data-admin-only>
        <i class="ti ti-receipt"></i>
        <span>Betalingen</span>
      </a>
      <a href="#" class="nav-item" data-view="chat">
        <i class="ti ti-message-circle"></i>
        <span>Chat</span>
        <span class="nav-badge" id="chatBadge" style="display:none"></span>
      </a>
      <a href="#" class="nav-item" data-view="contacts" data-admin-only>
        <i class="ti ti-address-book"></i>
        <span>Contacten</span>
        <span class="nav-badge" id="contactsBadge" style="display:none"></span>
      </a>
      <a href="#" class="nav-item" data-view="settings" data-admin-only>
        <i class="ti ti-settings"></i>
        <span>Instellingen</span>
      </a>
    </nav>

    <div class="sidebar-running" id="sidebarRunning" style="display:none">
      <div class="sidebar-running-label">Nu draait</div>
      <div class="sidebar-running-item">
        <span class="running-dot"></span>
        <span id="sidebarRunningText">Outreach run</span>
      </div>
      <div class="sidebar-running-progress">
        <div class="sidebar-running-bar" id="sidebarRunningBar" style="width:0%"></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-details">
          <div class="user-name" id="userName">Admin</div>
          <div class="user-role" id="userRole">Admin</div>
        </div>
      </div>
      <!-- Task 7 — Theme toggle always visible -->
      <button class="theme-toggle-btn" id="themeBtn" data-tooltip="Dark/light mode">
        <i class="ti ti-moon"></i>
      </button>
      <button class="btn-logout" id="logoutBtn" title="Uitloggen">
        <i class="ti ti-logout"></i>
      </button>
    </div>
  </aside>

  <!-- ── Main content ───────────────────────────────────────────── -->
  <main class="main-content" id="mainContent">
    <div id="appView"></div>
  </main>

  <!-- ── Mobile bottom nav ──────────────────────────────────────── -->
  <nav class="bottom-nav" id="bottomNav">
    <a href="#" class="bottom-nav-item" data-view="dashboard">
      <i class="ti ti-layout-dashboard"></i>
      <span>Dashboard</span>
    </a>
    <a href="#" class="bottom-nav-item" data-view="inbox">
      <i class="ti ti-inbox"></i>
      <span>Inbox</span>
      <span class="bottom-badge" id="inboxBadgeMobile" style="display:none"></span>
    </a>
    <a href="#" class="bottom-nav-item" data-view="pipeline">
      <i class="ti ti-git-branch"></i>
      <span>Pipeline</span>
      <span class="bottom-badge" id="pipelineBadgeMobile" style="display:none"></span>
    </a>
    <a href="#" class="bottom-nav-item" data-view="runs">
      <i class="ti ti-rotate-clockwise"></i>
      <span>Runs</span>
    </a>
    <a href="#" class="bottom-nav-item" data-view="settings">
      <i class="ti ti-settings"></i>
      <span>Instellingen</span>
    </a>
  </nav>

  <!-- ── Mobile notification bell ─────────────────────────────── -->
  <button class="notif-btn-mobile" id="notifBtnMobile" title="Meldingen">
    <i class="ti ti-bell"></i>
    <span class="notif-badge" id="notifBadgeMobile" style="display:none">0</span>
  </button>

  <!-- ── Toast container ───────────────────────────────────────── -->
  <div id="toastContainer"></div>

  <!-- ── Modal container ───────────────────────────────────────── -->
  <div id="modalContainer"></div>

  <!-- core.js must load first: shared state, auth, routing, lazy loader, init -->
  <script src="/core.js"></script>
  <!-- app.js kept for backward compat (now a stub) -->
  <script src="/app.js"></script>
</body>
</html>
