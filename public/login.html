<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency AI — Inloggen</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    /* ── Client section (top, prominent) ── */
    .client-section {
      padding: 40px 40px 32px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: #6366f1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-text { }
    .logo-name { font-size: 17px; font-weight: 700; color: #111111; letter-spacing: -0.3px; line-height: 1.2; }
    .logo-sub { font-size: 12px; color: #9ca3af; font-weight: 400; }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .section-subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      color: #111111;
      background: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }

    input.error-field {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.08);
    }

    /* Portal code input — centered, spaced */
    .input-code {
      letter-spacing: 3px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }

    .btn-primary .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-text { display: none; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0;
      border-top: 1px solid #f3f4f6;
    }

    /* ── Staff section (bottom, subtle) ── */
    .staff-section {
      padding: 24px 40px 32px;
      background: #fafafa;
    }

    .staff-header {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .staff-header strong {
      color: #6b7280;
      font-weight: 600;
    }

    /* Staff inputs — smaller */
    .staff-section input {
      height: 40px;
      font-size: 14px;
    }

    .staff-section .form-group { margin-bottom: 10px; }

    .staff-section label {
      font-size: 11px;
      color: #9ca3af;
    }

    .btn-staff {
      width: 100%;
      height: 40px;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-staff:hover { background: #333; }
    .btn-staff:disabled { background: #9ca3af; cursor: not-allowed; }

    .btn-staff .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-staff.loading .spinner { display: block; }
    .btn-staff.loading .btn-text { display: none; }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 12px;
      text-align: center;
    }

    .error-msg.visible { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .shake { animation: shake 0.4s ease; }

    @media (max-width: 480px) {
      .client-section, .staff-section { padding-left: 24px; padding-right: 24px; }
    }
  </style>
</head>
<body>
  <div class="card" id="mainCard">

    <!-- ── TOP: Client portal (prominent) ── -->
    <div class="client-section">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="logo-name">Klantportaal</div>
          <div class="logo-sub">Agency AI</div>
        </div>
      </div>

      <div class="section-title">Uw project bekijken</div>
      <div class="section-subtitle">Voer de portaalcode in die u heeft ontvangen</div>

      <form id="portalForm" novalidate>
        <div class="form-group">
          <label for="portalCode">Portaalcode</label>
          <input
            type="text"
            id="portalCode"
            class="input-code"
            placeholder="••••••••"
            autocomplete="off"
            spellcheck="false"
            maxlength="32"
            required
          >
        </div>

        <div class="error-msg" id="portalError"></div>

        <button type="submit" class="btn-primary" id="portalBtn">
          <div class="spinner"></div>
          <span class="btn-text">Mijn project bekijken &rarr;</span>
        </button>
      </form>
    </div>

    <!-- ── DIVIDER ── -->
    <div class="divider"></div>

    <!-- ── BOTTOM: Staff login (subtle) ── -->
    <div class="staff-section">
      <div class="staff-header">Bent u een <strong>medewerker of developer</strong>?</div>

      <form id="staffForm" novalidate>
        <div class="form-group">
          <label for="username">Gebruikersnaam</label>
          <input type="text" id="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Wachtwoord</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="error-msg" id="staffError"></div>

        <button type="submit" class="btn-staff" id="staffBtn">
          <div class="spinner"></div>
          <span class="btn-text">Inloggen als medewerker</span>
        </button>
      </form>
    </div>

  </div>

  <script>
    // Redirect already-logged-in staff
    if (localStorage.getItem('agencyToken')) {
      window.location.href = '/app/dashboard';
    }

    // Guard against double-submit / re-click during the redirect window
    let _redirecting = false;

    // ── Portal form ──────────────────────────────────────────────────────────
    const portalForm  = document.getElementById('portalForm');
    const portalInput = document.getElementById('portalCode');
    const portalBtn   = document.getElementById('portalBtn');
    const portalError = document.getElementById('portalError');

    // Strip spaces as user types
    portalInput.addEventListener('input', () => {
      const v = portalInput.value.replace(/\s/g, '');
      if (portalInput.value !== v) portalInput.value = v;
      portalError.classList.remove('visible');
      portalInput.classList.remove('error-field');
    });

    portalForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = portalInput.value.trim();
      if (!token) {
        portalError.textContent = 'Voer je portaalcode in.';
        portalError.classList.add('visible');
        portalInput.classList.add('error-field');
        return;
      }

      portalBtn.classList.add('loading');
      portalBtn.disabled = true;

      try {
        const res = await fetch(`/portal/${encodeURIComponent(token)}`);
        if (res.ok) {
          window.location.href = `/portal/${encodeURIComponent(token)}`;
        } else {
          portalError.textContent = 'Portaalcode niet gevonden. Controleer de code en probeer opnieuw.';
          portalError.classList.add('visible');
          portalInput.classList.add('error-field');
        }
      } catch {
        portalError.textContent = 'Kan geen verbinding maken. Probeer het opnieuw.';
        portalError.classList.add('visible');
      } finally {
        portalBtn.classList.remove('loading');
        portalBtn.disabled = false;
      }
    });

    // ── Staff form ───────────────────────────────────────────────────────────
    const staffForm   = document.getElementById('staffForm');
    const userInput   = document.getElementById('username');
    const passInput   = document.getElementById('password');
    const staffBtn    = document.getElementById('staffBtn');
    const staffError  = document.getElementById('staffError');
    const mainCard    = document.getElementById('mainCard');

    [userInput, passInput].forEach(el => el.addEventListener('input', () => {
      staffError.classList.remove('visible');
      el.classList.remove('error-field');
    }));

    staffForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (_redirecting) return; // already heading to /app — ignore extra clicks

      const username = userInput.value.trim();
      const password = passInput.value;

      if (!username || !password) {
        staffError.textContent = 'Vul je gebruikersnaam en wachtwoord in.';
        staffError.classList.add('visible');
        return;
      }

      staffBtn.classList.add('loading');
      staffBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          staffError.textContent = data.error || 'Inloggen mislukt.';
          staffError.classList.add('visible');
          userInput.classList.add('error-field');
          passInput.classList.add('error-field');
          mainCard.classList.remove('shake');
          void mainCard.offsetWidth;
          mainCard.classList.add('shake');
          return;
        }

        localStorage.setItem('agencyToken', data.token);
        localStorage.setItem('agencyName', data.agencyName);
        localStorage.setItem('myName', data.myName);
        localStorage.setItem('agencyRole', data.role || 'admin');
        localStorage.setItem('agencyPermissions', JSON.stringify(data.permissions || []));

        _redirecting = true; // block any further submits
        staffBtn.style.background = '#10b981';
        staffBtn.querySelector('.btn-text').textContent = '✓ Ingelogd';
        setTimeout(() => { window.location.href = '/app/dashboard'; }, 100);

      } catch {
        staffError.textContent = 'Kan geen verbinding maken met de server.';
        staffError.classList.add('visible');
      } finally {
        // Only restore button if we're NOT about to navigate away
        if (!_redirecting) {
          staffBtn.classList.remove('loading');
          staffBtn.disabled = false;
        }
      }
    });

    // Focus portal code on load
    portalInput.focus();
  </script>
</body>
</html>
