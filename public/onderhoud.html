<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <title>Onderhoud — Agency AI</title>
  <link rel="icon" href="/icon-192.png">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e5e7eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; margin: 0; }
    .card { max-width: 440px; width: 100%; background: #1a1a2e; border: 1px solid #2d2d4e; border-radius: 20px; padding: 48px 36px; text-align: center; }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.6; }
    .eta { margin-top: 20px; background: #6366f122; border: 1px solid #6366f144; border-radius: 8px; padding: 10px 16px; font-size: 13px; color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>Even geduld…</h1>
    <p>Agency AI is momenteel in onderhoud. We zijn zo snel mogelijk terug online.</p>
    <div class="eta">Verwachte hersteltijd: enkele minuten</div>
  </div>
  <script>setTimeout(() => window.location.reload(), 30000);</script>

</html>
