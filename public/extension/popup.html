<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agency AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 360px; background: #f9fafb; color: #111; font-size: 13px; }

  .header { background: #111; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .header-logo { width: 28px; height: 28px; background: #2563eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; flex-shrink: 0; }
  .header-title { font-weight: 700; font-size: 15px; }
  .header-sub { font-size: 11px; color: #9ca3af; margin-top: 1px; }
  .header-right { margin-left: auto; }
  .header-right button { background: #374151; border: none; color: #d1d5db; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
  .header-right button:hover { background: #4b5563; }

  .setup-panel { padding: 16px; }
  .setup-panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: #374151; }
  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .form-row input { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
  .form-row input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; justify-content: center; }
  .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
  .btn-danger { background: #dc2626; color: #fff; }

  .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #e5e7eb; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; }
  .stat-cell { background: #fff; padding: 10px 12px; text-align: center; }
  .stat-num { font-size: 18px; font-weight: 700; color: #111; line-height: 1; }
  .stat-lbl { font-size: 10px; color: #9ca3af; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

  .section-header { padding: 10px 16px 6px; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: space-between; }

  .inbox-list { max-height: 220px; overflow-y: auto; }
  .inbox-item { padding: 10px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
  .inbox-item:hover { background: #f9fafb; }
  .inbox-item-name { font-weight: 600; font-size: 13px; }
  .inbox-item-meta { font-size: 11px; color: #6b7280; margin-top: 2px; display: flex; gap: 8px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-blue { background: #eff6ff; color: #2563eb; }
  .badge-green { background: #f0fdf4; color: #16a34a; }
  .score-pill { font-weight: 700; }
  .score-high { color: #16a34a; }
  .score-mid  { color: #d97706; }
  .score-low  { color: #dc2626; }

  .add-panel { padding: 12px 16px; border-top: 1px solid #e5e7eb; }
  .add-panel-title { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 8px; }
  .page-preview { background: #f3f4f6; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .page-preview-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-preview-url  { font-size: 11px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .niche-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .niche-row label { font-size: 11px; font-weight: 600; color: #6b7280; flex-shrink: 0; }
  .niche-row select { flex: 1; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
  .add-btn { display: flex; align-items: center; gap: 6px; justify-content: center; width: 100%; padding: 9px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .add-btn:hover { background: #1d4ed8; }
  .add-btn:disabled { opacity: .5; cursor: not-allowed; }

  .toast { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 999; }
  .toast.show { opacity: 1; }

  .empty-state { text-align: center; padding: 24px 16px; color: #9ca3af; font-size: 12px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #d1d5db; border-top-color: #2563eb; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { padding: 12px 16px; background: #fef2f2; color: #dc2626; font-size: 12px; border-left: 3px solid #dc2626; margin: 8px 16px; border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">A</div>
  <div>
    <div class="header-title">Agency AI</div>
    <div class="header-sub" id="headerSub">Laden...</div>
  </div>
  <div class="header-right" id="headerRight" style="display:none">
    <button onclick="showSetup()">Instellingen</button>
  </div>
</div>

<div id="setupPanel" class="setup-panel" style="display:none">
  <h3>Verbinding instellen</h3>
  <div class="form-row">
    <label>Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://jouw-app.railway.app">
  </div>
  <div class="form-row">
    <label>API Sleutel</label>
    <input type="password" id="apiKey" placeholder="sk-agency-...">
  </div>
  <button class="btn btn-primary" id="saveConfigBtn" onclick="saveConfig()">Verbinding opslaan</button>
</div>

<div id="mainPanel" style="display:none">
  <div class="stats-bar" id="statsBar">
    <div class="stat-cell"><div class="stat-num" id="statPending">-</div><div class="stat-lbl">Te beoordelen</div></div>
    <div class="stat-cell"><div class="stat-num" id="statLeads">-</div><div class="stat-lbl">Leads</div></div>
    <div class="stat-cell"><div class="stat-num" id="statClients">-</div><div class="stat-lbl">Klanten</div></div>
  </div>

  <div class="section-header">
    <span>Inbox — wacht op beoordeling</span>
    <span id="refreshBtn" style="cursor:pointer;color:#2563eb" onclick="loadData()">↻</span>
  </div>
  <div class="inbox-list" id="inboxList"><div class="empty-state"><div class="spinner"></div></div></div>

  <div class="add-panel">
    <div class="add-panel-title">Huidige pagina toevoegen</div>
    <div class="page-preview" id="pagePreview">
      <div class="page-preview-name" id="previewName">Laden...</div>
      <div class="page-preview-url" id="previewUrl"></div>
    </div>
    <div class="niche-row">
      <label>Niche</label>
      <select id="nicheSelect">
        <option value="beauty">Beauty</option>
        <option value="food">Food & Horeca</option>
        <option value="fitness">Fitness & Wellness</option>
        <option value="retail">Retail</option>
        <option value="services">Diensten</option>
        <option value="healthcare">Zorg</option>
        <option value="education">Educatie</option>
        <option value="tech">Tech</option>
      </select>
    </div>
    <button class="add-btn" id="addPageBtn" onclick="addCurrentPage()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Toevoegen aan pipeline
    </button>
  </div>
</div>

<div id="toastEl" class="toast"></div>

<script src="popup.js"></script>
</body>
</html>
