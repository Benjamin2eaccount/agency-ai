<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projectstatus</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #6366f1;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #e5e7eb;
      --muted: #6b7280;
      --surface: #f9fafb;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f9fafb;
      color: #111;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }

    /* Agency header */
    .agency-header { text-align: center; padding: 28px 0 20px; }
    .agency-logo {
      width: 44px; height: 44px; background: #111; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px;
    }
    .agency-logo svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .agency-name { font-size: 15px; font-weight: 700; color: #111; }

    /* Project banner */
    .project-banner {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 24px; margin-bottom: 0;
    }
    .company-name { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
    .company-sub { font-size: 13px; color: var(--muted); }

    /* Phase tracker */
    .phase-track { display: flex; align-items: flex-start; margin: 20px 0 10px; }
    .phase-step { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .phase-connector { flex: 1; height: 2px; margin-top: 13px; background: var(--border); transition: background 0.3s; }
    .phase-connector.done { background: var(--success); }
    .phase-dot {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; border: 2px solid var(--border);
      background: #fff; color: var(--muted); position: relative; z-index: 1;
    }
    .phase-dot.done    { background: var(--success); border-color: var(--success); color: #fff; }
    .phase-dot.current { background: var(--accent);  border-color: var(--accent);  color: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
    .phase-label { font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 7px; text-align: center; max-width: 56px; line-height: 1.3; }
    .phase-label.done    { color: var(--success); }
    .phase-label.current { color: var(--accent); font-weight: 600; }

    .progress-wrap { background: #f3f4f6; border-radius: 99px; height: 5px; margin: 4px 0 10px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(to right, var(--success), var(--accent)); transition: width 0.6s ease; }
    .phase-caption { font-size: 13px; color: var(--muted); }
    .phase-caption strong { color: #111; }

    .date-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; background: var(--surface); border-radius: 8px;
      font-size: 13px; margin-top: 14px;
    }
    .date-row svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--muted); }

    /* Tabs */
    .tabs-wrap { background: #fff; border: 1px solid var(--border); border-radius: 14px; margin: 14px 0 0; overflow: hidden; }
    .tabs-nav {
      display: flex; border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; padding: 13px 16px; font-family: inherit; font-size: 13px;
      font-weight: 600; color: var(--muted); background: none; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .tab-btn:hover { color: #111; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-pane { padding: 20px 24px; display: none; }
    .tab-pane.active { display: block; }

    /* Sections inside tabs */
    .inner-section { margin-bottom: 24px; }
    .inner-section:last-child { margin-bottom: 0; }
    .inner-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

    /* Services */
    .svc-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px;
    }
    .svc-row:last-of-type { border-bottom: none; }
    .svc-price { font-weight: 600; font-size: 13px; }
    .svc-total { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 0; font-size: 14px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 4px; }

    /* Status badges */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .badge-paid      { background: #f0fdf4; color: #16a34a; }
    .badge-pending   { background: #fefce8; color: #d97706; }
    .badge-sent      { background: #eff6ff; color: #2563eb; }
    .badge-overdue   { background: #fef2f2; color: #dc2626; }
    .badge-cancelled { background: #f3f4f6; color: var(--muted); }

    /* Invoice cards */
    .invoice-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .invoice-card:last-child { margin-bottom: 0; }
    .invoice-card.overdue { border-color: #fca5a5; }
    .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .invoice-desc   { font-size: 14px; font-weight: 600; color: #111; }
    .invoice-amount { font-size: 15px; font-weight: 700; color: #111; }
    .invoice-meta   { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .invoice-pay-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; background: var(--accent); color: #fff;
      border-radius: 7px; text-decoration: none; font-size: 12px; font-weight: 600; margin-top: 10px;
    }
    .invoice-pay-btn:hover { opacity: .9; }

    /* Timeline */
    .timeline { display: flex; flex-direction: column; }
    .tl-item { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
    .tl-item::before { content: ''; position: absolute; left: 9px; top: 20px; bottom: 0; width: 2px; background: var(--border); }
    .tl-item:last-child::before { display: none; }
    .tl-dot { width: 20px; height: 20px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; margin-top: 2px; border: 2px solid #fff; box-shadow: 0 0 0 1px #d1d5db; }
    .tl-dot.accent  { background: var(--accent);  box-shadow: 0 0 0 1px var(--accent); }
    .tl-dot.success { background: var(--success); box-shadow: 0 0 0 1px var(--success); }
    .tl-dot.warn    { background: var(--warn);    box-shadow: 0 0 0 1px var(--warn); }
    .tl-content { flex: 1; }
    .tl-label { font-size: 13px; font-weight: 600; color: #111; line-height: 1.4; }
    .tl-time  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Messages */
    .msg-thread { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .msg-bubble {
      max-width: 85%; padding: 10px 14px; border-radius: 12px;
      font-size: 13px; line-height: 1.55;
    }
    .msg-bubble.client { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-meta { font-size: 11px; margin-top: 4px; }

    /* Content calendar */
    .cal-item { padding: 10px 12px; background: var(--surface); border: 1px solid #f3f4f6; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .cal-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
    .cal-tag { border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 700; }
    .tag-week { background: #eef2ff; color: #6366f1; }
    .tag-plat { background: #f3f4f6; color: #374151; }
    .tag-type { background: #fefce8; color: #d97706; }
    .tag-time { background: #f0fdf4; color: #16a34a; }
    .cal-topic    { font-weight: 700; color: #111; margin-bottom: 3px; }
    .cal-caption  { color: var(--muted); line-height: 1.5; margin-bottom: 3px; }
    .cal-hashtags { color: var(--accent); font-size: 12px; }

    /* FAQ / collapsible */
    .faq-item { border: 1px solid #f3f4f6; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
    .faq-q { background: var(--surface); padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: #111; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .faq-a { display: none; padding: 12px 14px; font-size: 13px; color: #374151; line-height: 1.6; }
    .faq-item.open .faq-a { display: block; }
    .faq-chevron { transition: transform 0.2s; flex-shrink: 0; }
    .faq-item.open .faq-chevron { transform: rotate(180deg); }

    /* Milestones */
    .milestone-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface); border: 1px solid #f3f4f6; border-radius: 8px; margin-bottom: 8px; }
    .milestone-week  { background: var(--accent); color: #fff; border-radius: 5px; padding: 3px 7px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .milestone-title { font-size: 13px; font-weight: 700; color: #111; }
    .milestone-desc  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Calendly button */
    .calendly-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #006bff; color: #fff; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none;
    }
    .calendly-btn:hover { opacity: .9; }

    /* Empty state */
    .empty-state { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 13px; }
    .empty-state svg { display: block; margin: 0 auto 10px; opacity: 0.35; }

    /* Form */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #374151; }
    .form-group input, .form-group textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px;
      font-size: 14px; font-family: inherit; outline: none; color: #111; transition: border-color 0.15s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { min-height: 80px; resize: vertical; }

    .btn-send {
      width: 100%; padding: 12px; background: #111; color: #fff; border: none;
      border-radius: 9px; font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: opacity 0.15s; margin-top: 4px;
    }
    .btn-send:hover { opacity: 0.85; }
    .btn-send:disabled { opacity: 0.45; cursor: not-allowed; }

    .success-msg {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
      padding: 14px; font-size: 14px; color: #166534;
      display: flex; align-items: center; gap: 10px;
    }

    /* Analytics */
    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    @media (max-width: 400px) { .analytics-grid { grid-template-columns: 1fr; } }
    .analytics-card { border-radius: 10px; padding: 14px 16px; border: 1px solid; }
    .analytics-card.green  { background: #f0fdf4; border-color: #bbf7d0; }
    .analytics-card.blue   { background: #eff6ff; border-color: #bfdbfe; }
    .analytics-card.purple { background: #f5f3ff; border-color: #ddd6fe; }
    .analytics-card.orange { background: #fff7ed; border-color: #fed7aa; }
    .analytics-card-title  { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .analytics-card.green  .analytics-card-title { color: #15803d; }
    .analytics-card.blue   .analytics-card-title { color: #1d4ed8; }
    .analytics-card.purple .analytics-card-title { color: #6d28d9; }
    .analytics-card.orange .analytics-card-title { color: #c2410c; }
    .analytics-stat { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,.05); }
    .analytics-stat:last-child { border-bottom: none; }
    .analytics-stat-label { font-size: 12px; color: #374151; }
    .analytics-stat-right  { display: flex; align-items: baseline; gap: 6px; }
    .analytics-stat-value  { font-size: 14px; font-weight: 700; color: #111; }
    .analytics-trend-up   { font-size: 11px; font-weight: 700; color: #16a34a; }
    .analytics-trend-down { font-size: 11px; font-weight: 700; color: #dc2626; }
    .analytics-disclaimer { font-size: 11px; color: var(--muted); background: var(--surface); border-radius: 8px; padding: 10px 12px; margin-top: 16px; line-height: 1.5; }

    /* Document vault */
    .doc-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
    .doc-card:last-child { margin-bottom: 0; }
    .doc-card-header { display: flex; align-items: flex-start; gap: 10px; }
    .doc-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .doc-icon.link     { background: #eff6ff; color: #2563eb; }
    .doc-icon.password { background: #fef3c7; color: #d97706; }
    .doc-icon.note     { background: #f0fdf4; color: #16a34a; }
    .doc-title { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 2px; }
    .doc-desc  { font-size: 12px; color: var(--muted); }
    .doc-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .doc-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;
      text-decoration: none; cursor: pointer; border: 1.5px solid var(--border);
      background: #fff; color: #111; font-family: inherit;
    }
    .doc-btn:hover { background: var(--surface); }
    .doc-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .doc-btn.primary:hover { opacity: .9; }
    .doc-password-field { display: flex; align-items: center; gap: 8px; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 7px 12px; }
    .doc-password-value { font-family: monospace; font-size: 13px; flex: 1; color: #111; letter-spacing: .05em; }

    /* Live chat widget */
    .chat-fab {
      position: fixed; bottom: 24px; right: 20px; z-index: 1000;
      width: 52px; height: 52px; border-radius: 50%; background: var(--accent);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(99,102,241,.45); transition: transform 0.2s;
    }
    .chat-fab:hover { transform: scale(1.08); }
    .chat-fab svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chat-fab-badge {
      position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px;
      background: #ef4444; color: #fff; border-radius: 99px; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; padding: 0 4px; display: none;
    }
    .chat-panel {
      position: fixed; bottom: 88px; right: 16px; width: 320px; max-height: 480px;
      background: #fff; border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.14); display: flex; flex-direction: column;
      z-index: 999; overflow: hidden; display: none;
    }
    @media (max-width: 400px) { .chat-panel { width: calc(100vw - 32px); right: 16px; } }
    .chat-panel-header {
      padding: 14px 16px; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-panel-title { font-size: 14px; font-weight: 700; }
    .chat-panel-close { background: none; border: none; color: rgba(255,255,255,.8); cursor: pointer; font-size: 18px; line-height: 1; padding: 0; }
    .chat-panel-close:hover { color: #fff; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .chat-msg.client { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-msg.admin  { background: #f3f4f6; color: #111; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-msg-meta   { font-size: 10px; margin-top: 3px; opacity: .65; }
    .chat-input-area { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
    .chat-input-area textarea {
      flex: 1; min-height: 38px; max-height: 100px; padding: 8px 10px; border: 1.5px solid var(--border);
      border-radius: 8px; font-family: inherit; font-size: 13px; resize: none; outline: none;
    }
    .chat-input-area textarea:focus { border-color: var(--accent); }
    .chat-send-btn {
      width: 36px; height: 36px; border-radius: 8px; background: var(--accent); border: none;
      color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .chat-send-btn:hover { opacity: .85; }
    .chat-name-row { padding: 8px 10px 0; display: flex; gap: 8px; }
    .chat-name-row input {
      flex: 1; height: 34px; padding: 0 10px; border: 1.5px solid var(--border); border-radius: 7px;
      font-family: inherit; font-size: 12px; outline: none;
    }
    .chat-name-row input:focus { border-color: var(--accent); }

    /* Loader */
    .center-page { text-align: center; padding: 80px 20px; color: var(--muted); }
    .center-page h2 { font-size: 18px; color: #111; margin: 12px 0 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 26px; height: 26px; border: 2px solid #e5e7eb; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"><div class="center-page"><div class="spinner"></div><p>Laden...</p></div></div>
  </div>

  <script>
    const PHASES = [
      { num: 1, label: 'Intake' },
      { num: 2, label: 'Strategie' },
      { num: 3, label: 'Uitvoering' },
      { num: 4, label: 'Live gaan' },
      { num: 5, label: 'Optimalisatie' }
    ];

    const CHECK   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const CHEVRON = `<svg class="faq-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
    const CAL_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;

    function e(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function getToken() {
      return window.location.pathname.split('/').filter(Boolean).pop();
    }

    function fmt(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function fmtS(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function load() {
      const token = getToken();
      if (!token || token === 'portal') { renderError('Geen portaallink gevonden.'); return; }
      try {
        const res = await fetch('/api/portal/' + token);
        if (!res.ok) { renderError('Portaal niet gevonden. Controleer de link.'); return; }
        const data = await res.json();
        renderPortal(data, token);
        initChatWidget(token, data.portalChat || []);
        pollChat(token);
      } catch {
        renderError('Kan de pagina niet laden. Probeer het later opnieuw.');
      }
    }

    function renderError(msg) {
      document.getElementById('root').innerHTML = `
        <div class="center-page">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h2>Niet gevonden</h2><p>${msg}</p>
        </div>`;
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.dataset.pane === tab));
    }

    function toggleFaq(id) {
      document.getElementById(id).classList.toggle('open');
    }

    function payBadge(p) {
      const overdue = p.dueDate && !p.paidAt && new Date(p.dueDate) < new Date() && p.status !== 'paid';
      if (p.status === 'paid')      return `<span class="badge badge-paid">Betaald</span>`;
      if (overdue)                   return `<span class="badge badge-overdue">Te laat</span>`;
      if (p.status === 'sent')       return `<span class="badge badge-sent">Verzonden</span>`;
      if (p.status === 'cancelled')  return `<span class="badge badge-cancelled">Geannuleerd</span>`;
      return `<span class="badge badge-pending">In afwachting</span>`;
    }

    function tlDotClass(event) {
      if (['projectStarted','approved','client','replied'].includes(event)) return 'accent';
      if (['emailSent','followup1','followup2'].includes(event))            return 'warn';
      if (['intakeSubmitted','deliveryReady','taskCompleted'].includes(event)) return 'success';
      return '';
    }

    function tlLabel(h) {
      const map = {
        projectStarted: 'Project gestart',
        approved:       'Lead goedgekeurd',
        emailSent:      'E-mail verstuurd',
        followup1:      'Follow-up 1 verstuurd',
        followup2:      'Follow-up 2 verstuurd',
        replied:        'Klant heeft gereageerd',
        intakeSubmitted:'Intakeformulier ingevuld',
        deliveryReady:  'Levering klaar',
        clientMessage:  'Klantbericht ontvangen',
        taskCompleted:  'Taak afgerond',
        weekComplete:   'Week afgerond',
        proposalSent:   'Voorstel verstuurd',
        contractSent:   'Contract verstuurd',
        caseStudy:      'Case study bijgewerkt',
        upsell:         'Upsell aangeboden',
      };
      return map[h.event] || h.label || h.event || 'Gebeurtenis';
    }

    function renderPortal(data, token) {
      document.title = 'Projectstatus – ' + (data.companyName || '');
      const cur      = data.currentPhase || 1;
      const pct      = Math.round(((cur - 1) / (PHASES.length - 1)) * 100);
      const svcs     = data.services  || [];
      const payments = data.payments  || [];
      const messages = data.messages  || [];

      /* ── Phase tracker ── */
      const phaseTrack = PHASES.map((p, i) => {
        const done = p.num < cur, current = p.num === cur;
        const conn = i < PHASES.length - 1
          ? `<div class="phase-connector${done ? ' done' : ''}"></div>` : '';
        return `<div class="phase-step">
          <div class="phase-dot ${done ? 'done' : current ? 'current' : ''}">${done ? CHECK : p.num}</div>
          <div class="phase-label ${done ? 'done' : current ? 'current' : ''}">${p.label}</div>
        </div>${conn}`;
      }).join('');

      /* ── Overzicht tab ── */
      const monthlyTotal = svcs.filter(s => s.billing !== 'eenmalig').reduce((s,v)=>s+(v.price||0),0);
      const onceTotal    = svcs.filter(s => s.billing === 'eenmalig').reduce((s,v)=>s+(v.price||0),0);

      const svcsHtml = svcs.length > 0 ? `
        <div class="inner-section">
          <div class="inner-label">Diensten &amp; Investering</div>
          ${svcs.map(s => {
            const isOnce = s.billing === 'eenmalig';
            return `<div class="svc-row"><span>${e(s.name)}</span><span class="svc-price">€${(s.price||0).toLocaleString('nl-NL')}${isOnce?' eenmalig':'/mnd'}</span></div>`;
          }).join('')}
          ${svcs.length > 1 ? (
            (monthlyTotal > 0 ? `<div class="svc-total"><span>Totaal per maand</span><span>€${monthlyTotal.toLocaleString('nl-NL')}</span></div>` : '') +
            (onceTotal > 0   ? `<div class="svc-total"><span>Totaal eenmalig</span><span>€${onceTotal.toLocaleString('nl-NL')}</span></div>` : '')
          ) : ''}
        </div>` : '';

      const calendlyHtml = data.calendlyUrl ? `
        <div class="inner-section">
          <div class="inner-label">Gesprek inplannen</div>
          <p style="font-size:13px;color:#6b7280;margin-bottom:14px">Kies direct een moment dat jou uitkomt.</p>
          <a href="${data.calendlyUrl}" target="_blank" rel="noopener" class="calendly-btn">
            ${CAL_SVG} Gesprek inplannen
          </a>
        </div>` : '';


      /* ── Facturen tab ── */
      const openCount = payments.filter(p => p.status !== 'paid' && p.status !== 'cancelled').length;
      const facturenHtml = payments.length > 0
        ? payments.map(p => {
            const ov = p.dueDate && !p.paidAt && new Date(p.dueDate) < new Date() && p.status !== 'paid';
            return `<div class="invoice-card${ov ? ' overdue' : ''}">
              <div class="invoice-header">
                <div class="invoice-desc">${p.description || 'Factuur'}</div>

                ${payBadge(p)}

              ${p.paymentUrl && p.status !== 'paid' && p.status !== 'cancelled' ? `
                <a href="${p.paymentUrl}" target="_blank" rel="noopener" class="invoice-pay-btn">

                </a>` : ''}
            </div>`;
          }).join('')
        : `<div class="empty-state">
             <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
             <p>Nog geen facturen aangemaakt</p>
           </div>`;

      /* ── Leveringen tab ── */

      /* ── Leveringen tab ── */
      const calItems   = data.delivery?.contentCalendar?.items || [];
      const faqs       = data.delivery?.chatbotFlow?.faqs || [];
      const milestones = data.delivery?.milestones?.milestones || [];
      const hasSite    = !!data.generatedSite;
      const hasReports = (data.reports || []).length > 0;

      const calHtml = calItems.length > 0 ? `
        <div class="inner-section">
          <div class="inner-label">Content kalender — Maand 1</div>
          ${calItems.map(item => `
            <div class="cal-item">

      const faqHtml = faqs.length > 0 ? `

      const msHtml = milestones.length > 0 ? `

            <div class="milestone-row">

      const _siteUrl = hasSite && data.generatedSite.siteUrl

            <div id="siteFbOk" style="display:none;margin-top:10px;color:#16a34a;font-size:13px;font-weight:600">✓ Aanpassingen ontvangen!</div>
          </div>
        </div>` : '';

      const reportsHtml = hasReports ? `
        <div class="inner-section">

      // Shared project files
      const sharedFiles = data.sharedProjectFiles || [];
      const sharedFilesHtml = sharedFiles.length > 0 ? `

            return `<div style="padding:12px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;background:#f9fafb">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${absUrl?'10px':'0'}">
                <div>
                  <div style="font-size:13px;font-weight:600;color:#111">${icon} ${(f.name||'').replace(/</g,'&lt;')}</div>
                  <div style="font-size:11px;color:#6b7280">Toegevoegd ${fmt(f.createdAt)}</div>
                </div>
                ${absUrl ? `<a href="${absUrl.replace(/"/g,'&quot;')}" target="_blank" style="font-size:12px;background:#6366f1;color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none;white-space:nowrap">Bekijken →</a>` : ''}
              </div>
              ${absUrl && f.type === 'html' ? `
              <div style="border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;margin-top:10px">
                <iframe src="${absUrl.replace(/"/g,'&quot;')}" style="width:100%;height:300px;border:none;display:block" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"></iframe>
                <div style="display:none;padding:20px;text-align:center;font-size:13px;color:#6b7280;background:#f9fafb">Preview niet beschikbaar — <a href="${absUrl.replace(/"/g,'&quot;')}" target="_blank" rel="noopener" style="color:#6366f1;text-decoration:underline;margin-left:4px">open pagina in nieuw tabblad →</a></div>
              </div>` : ''}
            </div>`;
          }).join('')}
        </div>` : '';

      // Approved agent deliverables
      const approvedDelivs = data.approvedDeliverables || [];
      const _absUrl = u => !u ? '' : (u.startsWith('http') ? u : (window.location.origin + u));
      const delivHtml = approvedDelivs.length > 0 ? `
        <div class="inner-section">
          <div class="inner-label">Gebouwde leveringen</div>
          ${approvedDelivs.map(d => {
            const typeIcon = d.type === 'code' ? '💻' : d.deliverableType === 'strategy' ? '📊' : '📄';
            const typeLabel = d.type === 'code' ? 'Interactieve pagina' : d.deliverableType === 'strategy' ? 'Strategiedocument' : 'Document';
            const absUrl = _absUrl(d.url);
            return `<div style="padding:12px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;background:#f9fafb">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${absUrl && d.type==='code'?'10px':'0'}">
                <div>
                  <div style="font-size:13px;font-weight:600;color:#111">${typeIcon} ${(d.service||'').replace(/</g,'&lt;')}</div>
                  <div style="font-size:11px;color:#6b7280">${typeLabel} · Goedgekeurd</div>
                </div>
                ${absUrl ? `<a href="${absUrl.replace(/"/g,'&quot;')}" target="_blank" style="font-size:12px;background:#6366f1;color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none;white-space:nowrap">Bekijken →</a>` : ''}
              </div>
              ${absUrl && d.type==='code' ? `
              <div style="border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;margin-top:10px">
                <iframe src="${absUrl.replace(/"/g,'&quot;')}" style="width:100%;height:300px;border:none;display:block" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"></iframe>
                <div style="display:none;padding:20px;text-align:center;font-size:13px;color:#6b7280;background:#f9fafb">Preview niet beschikbaar — <a href="${absUrl.replace(/"/g,'&quot;')}" target="_blank" rel="noopener" style="color:#6366f1;text-decoration:underline;margin-left:4px">open pagina in nieuw tabblad →</a></div>
              </div>` : ''}
            </div>`;

      const leveringenHtml = (sharedFilesHtml || delivHtml || calHtml || faqHtml || msHtml || siteHtml || reportsHtml)
        ? sharedFilesHtml + delivHtml + calHtml + faqHtml + msHtml + siteHtml + reportsHtml
        : `<div class="empty-state">
             <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
             <p>Nog geen leveringen beschikbaar</p>
           </div>`;

      /* ── Documenten tab ── */
      const docs = data.documents || [];
      const LOCK_SVG  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
      const LINK_SVG  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
      const NOTE_SVG  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`;

      const docIcon = type => ({ link: LINK_SVG, password: LOCK_SVG, note: NOTE_SVG }[type] || NOTE_SVG);

      const documentsHtml = docs.length > 0 ? docs.map(doc => {
        const isLink = doc.type === 'link';
        const isPw   = doc.type === 'password';
        const isNote = doc.type === 'note';
        return `
          <div class="doc-card">
            <div class="doc-card-header">
              <div class="doc-icon ${doc.type || 'note'}">${docIcon(doc.type)}</div>
              <div style="flex:1;min-width:0">
                <div class="doc-title">${(doc.title||'').replace(/</g,'&lt;')}</div>
                ${doc.description ? `<div class="doc-desc">${(doc.description||'').replace(/</g,'&lt;')}</div>` : ''}

            ${isLink && doc.content ? `
              <div class="doc-actions">
                <a class="doc-btn primary" href="${(doc.content||'').replace(/"/g,'&quot;')}" target="_blank" rel="noopener">${LINK_SVG} Openen</a>

            ${isPw ? `
              <div style="margin-top:10px">
                ${doc.username ? `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Gebruikersnaam: <strong style="color:#111">${(doc.username||'').replace(/</g,'&lt;')}</strong></div>` : ''}
                <div class="doc-password-field">
                  <span class="doc-password-value" id="pw-${doc.id}">••••••••</span>
                  <button class="doc-btn" style="border:none;padding:4px 8px" onclick="togglePw('${doc.id}',${JSON.stringify(doc.content||'')})">Toon</button>
                  <button class="doc-btn" style="border:none;padding:4px 8px" onclick="navigator.clipboard.writeText(${JSON.stringify(doc.content||'')}).then(()=>this.textContent='✓')">Kopieer</button>
                </div>
              </div>` : ''}
            ${isNote && doc.content ? `<div style="margin-top:10px;font-size:13px;color:#374151;background:var(--surface);border-radius:7px;padding:10px 12px;white-space:pre-line;line-height:1.6">${(doc.content||'').replace(/</g,'&lt;')}</div>` : ''}
          </div>`;
      }).join('') : `
        <div class="empty-state">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <p>Nog geen documenten beschikbaar. Uw accountmanager zal hier binnenkort bestanden en links plaatsen.</p>
        </div>`;

      /* ── Resultaten tab (real data only) ── */
      const ra = data.analytics || {};
      const bk = ra.bookings   || {};
      const dv = ra.deliverables || {};
      const pj = ra.project    || {};
      const em = ra.emails     || {};

      const statRow = (label, value) =>
        `<div class="analytics-stat">
           <span class="analytics-stat-label">${label}</span>
           <span class="analytics-stat-value">${value}</span>
         </div>`;

      const bookingsSection = `
        <div class="analytics-card blue" style="margin-bottom:10px">
          <div class="analytics-card-title" style="color:#1d4ed8">📅 Boekingen</div>
          ${bk.total > 0 ? `
            ${statRow('Totaal boekingen', bk.total)}
            ${statRow('Boekingen deze maand', bk.thisMonth || 0)}
            ${bk.lastBooking ? statRow('Laatste boeking', fmtS(bk.lastBooking)) : ''}
            ${bk.popularService ? statRow('Populairste dienst', e(bk.popularService)) : ''}
          ` : `<div style="font-size:13px;color:var(--muted);padding:4px 0">Nog geen boekingen ontvangen.</div>`}
        </div>`;

      const delivSection = `
        <div class="analytics-card green" style="margin-bottom:10px">
          <div class="analytics-card-title" style="color:#15803d">💻 Gebouwde pagina's</div>
          ${dv.total > 0 ? `
            ${statRow("Pagina's gebouwd", dv.total)}
            ${dv.lastBuilt ? statRow('Laatste update', fmtS(dv.lastBuilt)) : ''}
            <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
              ${(dv.items||[]).map(d => `
                <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-top:1px solid rgba(0,0,0,.06)">
                  <span style="color:#374151;font-weight:600">${e(d.service)}</span>
                  ${d.url ? `<a href="${d.url}" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;font-size:11px">Bekijk →</a>` : '<span style="color:var(--muted);font-size:11px">Geen link</span>'}
                </div>`).join('')}
            </div>
          ` : `<div style="font-size:13px;color:var(--muted);padding:4px 0">Nog geen pagina's gebouwd.</div>`}
        </div>`;

      const projectSection = `
        <div class="analytics-card purple" style="margin-bottom:10px">
          <div class="analytics-card-title" style="color:#6d28d9">📊 Project voortgang</div>
          ${pj.startDate ? `
            ${pj.phase    ? statRow('Huidige fase', 'Fase ' + pj.phase + ' van 5') : ''}
            ${pj.daysActive !== null ? statRow('Dagen actief als klant', pj.daysActive) : ''}
            ${pj.tasksTotal > 0 ? statRow('Taken voltooid', pj.tasksCompleted + ' van ' + pj.tasksTotal) : ''}
          ` : `<div style="font-size:13px;color:var(--muted);padding:4px 0">Project is nog niet gestart.</div>`}
        </div>`;

      const emailSection = em.total > 0 ? `
        <div class="analytics-card orange" style="margin-bottom:10px">
          <div class="analytics-card-title" style="color:#c2410c">✉️ Communicatie</div>
          ${statRow('Berichten ontvangen', em.total)}
          ${em.lastSent ? statRow('Laatste bericht', fmtS(em.lastSent)) : ''}
        </div>` : '';

      const analyticsHtml = `
        <div style="margin-bottom:14px">
          ${bookingsSection}
          ${delivSection}
          ${projectSection}
          ${emailSection}
        </div>`;

      /* ── Tab badge for open invoices ── */
      const payTabLabel = openCount > 0
        ? `Facturen <span style="background:#ef4444;color:#fff;border-radius:99px;font-size:10px;padding:1px 5px;font-weight:700;margin-left:3px">${openCount}</span>`
        : 'Facturen';

      /* ── Render ── */
      document.getElementById('root').innerHTML = `
        <div class="agency-header">
          <div class="agency-logo">
            ${data.agencyLogo ? `<img src="${e(data.agencyLogo)}" style="width:26px;height:26px;object-fit:contain;border-radius:4px;display:block" alt="${e(data.agencyName)}">` : '<svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>'}
          </div>
          <div class="agency-name">${e(data.agencyName)}</div>
        </div>

        <div class="project-banner">
          <div class="company-name">${e(data.companyName)}</div>
          <div class="company-sub">Bijgewerkt door ${e(data.myName || data.agencyName)}</div>
          <div class="phase-track">${phaseTrack}</div>
          <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="phase-caption">Fase: <strong>Fase ${cur} — ${PHASES[cur-1]?.label}</strong></div>
          ${data.estimatedCompletion ? `
            <div class="date-row">${CAL_SVG} Verwachte afronddatum: <strong>${fmt(data.estimatedCompletion)}</strong></div>` : ''}
        </div>

        <div class="tabs-wrap">
          <nav class="tabs-nav">
            <button class="tab-btn active" data-tab="overview"   onclick="showTab('overview')">Overzicht</button>
            <button class="tab-btn"         data-tab="leveringen" onclick="showTab('leveringen')">Leveringen</button>
            <button class="tab-btn"         data-tab="facturen"   onclick="showTab('facturen')">${payTabLabel}</button>
            <button class="tab-btn"         data-tab="documenten" onclick="showTab('documenten')">${docs.length > 0 ? `Documenten <span style="background:var(--accent);color:#fff;border-radius:99px;font-size:10px;padding:1px 5px;font-weight:700;margin-left:3px">${docs.length}</span>` : 'Documenten'}</button>
            <button class="tab-btn"         data-tab="resultaten" onclick="showTab('resultaten')">Resultaten</button>
            <button class="tab-btn"         data-tab="berichten"  onclick="showTab('berichten')">Berichten</button>
          </nav>

          <div class="tab-pane active" data-pane="overview">
            ${data.portalWelcomeMessage ? `
              <div class="inner-section" style="background:linear-gradient(135deg,#eff6ff,#f8faff);border:1.5px solid #bfdbfe;border-radius:10px;padding:14px 16px">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
                  <span style="font-size:15px">👋</span>
                  <span style="font-size:12px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:.06em">Bericht van uw accountmanager</span>
                </div>
                <p style="margin:0;font-size:14px;line-height:1.65;color:#1e3a8a;white-space:pre-line">${e(data.portalWelcomeMessage)}</p>
              </div>` : ''}
            ${svcsHtml}
            ${calendlyHtml}
            ${!data.portalWelcomeMessage && !svcsHtml && !calendlyHtml ? '<div class="empty-state"><p>Nog geen projectinformatie beschikbaar.</p></div>' : ''}
          </div>

          <div class="tab-pane" data-pane="leveringen">
            ${leveringenHtml}
          </div>

          <div class="tab-pane" data-pane="facturen">
            ${facturenHtml}
          </div>

          <div class="tab-pane" data-pane="documenten">
            ${documentsHtml}
          </div>

          <div class="tab-pane" data-pane="resultaten">
            ${analyticsHtml}
          </div>

          <div class="tab-pane" data-pane="berichten">
            <div class="inner-label">Gesprek met uw accountmanager</div>
            <div id="tabChatThread" style="display:flex;flex-direction:column;gap:8px;min-height:80px;margin-bottom:14px">
              ${(data.portalChat||[]).length === 0
                ? `<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px 0">Nog geen berichten. Stuur ons een bericht!</div>`
                : (data.portalChat||[]).map(m => `
                    <div style="max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;${m.from==='client'?'background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;margin-left:auto':'background:#f3f4f6;color:#111;align-self:flex-start;border-bottom-left-radius:4px'}">
                      ${(m.message||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
                      <div style="font-size:10px;margin-top:3px;opacity:.65">${m.from==='admin'?(m.name||'Accountmanager'):(m.name||'U')} · ${fmtS(m.time)}</div>
                    </div>`).join('')}
            </div>
            <div id="msgForm" style="border-top:1px solid var(--border);padding-top:14px">
              <div class="form-group">
                <label>Uw naam</label>
                <input type="text" id="msgName" placeholder="Uw naam">
              </div>
              <div class="form-group">
                <label>Bericht</label>
                <textarea id="msgText" placeholder="Schrijf hier uw vraag of opmerking..."></textarea>
              </div>
              <button class="btn-send" id="sendBtn" onclick="sendMsg('${token}')">Verstuur bericht</button>
            </div>
          </div>
        </div>
      `;
    }

    async function submitSiteFeedback(token) {
      const feedback = document.getElementById('portalSiteFb')?.value?.trim();
      if (!feedback) { alert('Voer feedback in.'); return; }
      try {
        const res = await fetch('/api/portal/' + token + '/site-feedback', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ feedback })
        });
        if (res.ok) {
          document.getElementById('siteFbOk').style.display = '';
          document.getElementById('portalSiteFb').value = '';
        } else { alert('Versturen mislukt.'); }
      } catch { alert('Verbindingsfout.'); }
    }

    async function sendMsg(token) {
      const nameEl    = document.getElementById('msgName');
      const textEl    = document.getElementById('msgText');
      const btn       = document.getElementById('sendBtn');
      const name      = nameEl?.value?.trim();
      const message   = textEl?.value?.trim();
      if (!name || !message) { alert('Vul je naam en een bericht in.'); return; }
      btn.disabled = true;
      btn.textContent = 'Versturen...';
      try {
        const res = await fetch('/api/portal/' + token + '/message', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, message })
        });
        if (res.ok) {
          if (textEl) textEl.value = '';
          btn.textContent = '✓ Verstuurd!';
          btn.style.background = '#16a34a';
          setTimeout(() => { btn.disabled = false; btn.textContent = 'Verstuur bericht'; btn.style.background = ''; }, 2500);
          // Refresh thread immediately
          clearTimeout(_chatPollTimer);
          pollChat(token);
        } else {
          btn.disabled = false;
          btn.textContent = 'Verstuur bericht';
          alert('Versturen mislukt. Probeer het opnieuw.');
        }
      } catch {
        btn.disabled = false;
        btn.textContent = 'Verstuur bericht';
        alert('Verbindingsfout. Probeer het opnieuw.');
      }
    }

    // ── Document vault helpers ───────────────────────────────────────────────
    function togglePw(id, value) {
      const el  = document.getElementById('pw-' + id);
      const btn = el?.nextElementSibling;
      if (!el) return;
      if (el.dataset.shown === '1') { el.textContent = '••••••••'; el.dataset.shown = ''; if (btn) btn.textContent = 'Toon'; }
      else { el.textContent = value; el.dataset.shown = '1'; if (btn) btn.textContent = 'Verberg'; }
    }

    // ── Floating chat widget ─────────────────────────────────────────────────
    let _chatOpen = false;
    let _chatPollTimer = null;
    let _chatName = localStorage.getItem('portalChatName') || '';
    let _lastMsgCount = 0;

    function initChatWidget(token, initialChat) {
      _lastMsgCount = initialChat.length;
      // Inject floating elements
      document.body.insertAdjacentHTML('beforeend', `
        <button class="chat-fab" id="chatFab" onclick="toggleChatPanel()" title="Chat met ons">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="chat-fab-badge" id="chatFabBadge"></span>
        </button>
        <div class="chat-panel" id="chatPanel">
          <div class="chat-panel-header">
            <span class="chat-panel-title">💬 Chat met ons</span>
            <button class="chat-panel-close" onclick="toggleChatPanel()">✕</button>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-name-row" id="chatNameRow">
            <input type="text" id="chatNameInput" placeholder="Uw naam" value="${_chatName.replace(/"/g,'&quot;')}"
              oninput="localStorage.setItem('portalChatName',this.value);_chatName=this.value">
          </div>
          <div class="chat-input-area">
            <textarea id="chatInput" placeholder="Schrijf een bericht..." rows="1"
              oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg('${token}');}"></textarea>
            <button class="chat-send-btn" onclick="sendChatMsg('${token}')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      `);
      renderChatMessages(initialChat);
    }

    function renderChatMessages(chat) {
      const el = document.getElementById('chatMessages');
      if (el) {
        if (chat.length === 0) {
          el.innerHTML = '<div style="font-size:12px;color:#9ca3af;text-align:center;padding:20px 0">Stuur een bericht om het gesprek te starten.</div>';
        } else {
          el.innerHTML = chat.map(m => `
            <div>
              <div class="chat-msg ${m.from === 'client' ? 'client' : 'admin'}">
                ${(m.message||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
              </div>
              <div class="chat-msg-meta" style="text-align:${m.from==='client'?'right':'left'};font-size:10px;color:#9ca3af;margin:2px 4px">
                ${m.from==='admin'?(m.name||'Accountmanager'):(m.name||'U')} · ${fmtS(m.time)}
              </div>
            </div>`).join('');
          el.scrollTop = el.scrollHeight;
        }
      }
      // Also update the Berichten tab thread
      const tab = document.getElementById('tabChatThread');
      if (tab) {
        if (chat.length === 0) {
          tab.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px 0">Nog geen berichten. Stuur ons een bericht!</div>';
        } else {
          tab.innerHTML = chat.map(m => `
            <div style="max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;${m.from==='client'?'background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;margin-left:auto':'background:#f3f4f6;color:#111;align-self:flex-start;border-bottom-left-radius:4px'}">
              ${(m.message||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
              <div style="font-size:10px;margin-top:3px;opacity:.65">${m.from==='admin'?(m.name||'Accountmanager'):(m.name||'U')} · ${fmtS(m.time)}</div>
            </div>`).join('');
        }
      }
    }

    async function pollChat(token) {
      try {
        const res = await fetch('/api/portal/' + token + '/chat');
        if (!res.ok) return;
        const data = await res.json();
        const chat = data.chat || [];
        const adminMsgs = chat.filter(m => m.from === 'admin');
        const newAdminCount = adminMsgs.length;
        if (!_chatOpen && newAdminCount > 0) {
          const badge = document.getElementById('chatFabBadge');
          if (badge) { badge.textContent = newAdminCount; badge.style.display = 'flex'; }
        }
        renderChatMessages(chat);
        _lastMsgCount = chat.length;
      } catch { /* ignore */ }
      _chatPollTimer = setTimeout(() => pollChat(token), 30000);
    }

    function toggleChatPanel() {
      _chatOpen = !_chatOpen;
      const panel = document.getElementById('chatPanel');
      if (panel) panel.style.display = _chatOpen ? 'flex' : 'none';
      if (_chatOpen) {
        const badge = document.getElementById('chatFabBadge');
        if (badge) badge.style.display = 'none';
        setTimeout(() => {
          const el = document.getElementById('chatMessages');
          if (el) el.scrollTop = el.scrollHeight;
        }, 50);
      }
    }

    async function sendChatMsg(token) {
      const msg  = document.getElementById('chatInput')?.value?.trim();
      const name = document.getElementById('chatNameInput')?.value?.trim() || 'Klant';
      if (!msg) return;
      const inp = document.getElementById('chatInput');
      if (inp) { inp.value = ''; inp.style.height = 'auto'; }
      try {
        await fetch('/api/portal/' + token + '/message', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, message: msg })
        });
        await pollChat(token);
      } catch { alert('Versturen mislukt.'); }
    }

    load();
  </script>
</body>
</html>
