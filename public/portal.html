    // ── Chat Widget ───────────────────────────────────────────────────────
    function ChatWidget({ token, initialChat }) {
      const [open, setOpen]           = useState(false);
      const [chat, setChat]           = useState(initialChat);
      const [chatName, setChatName]   = useState(localStorage.getItem('portalChatName') || '');
      const [input, setInput]         = useState('');
      const [badge, setBadge]         = useState(0);
      const messagesRef               = useRef(null);
      const pollRef                   = useRef(null);

      const pollChat = useCallback(async () => {
        try {
          const r = await portalFetch(`/api/portal/${token}/chat`);
          if (!r.ok) return;
          const d = await r.json();
          const c = d.chat || [];
          setChat(c);
          const adminCount = c.filter(m => m.from === 'admin').length;
          if (!open && adminCount > 0) setBadge(adminCount);
        } catch {}
      }, [token, open]);

      useEffect(() => {
        // Near-real-time: poll every 8s while the panel is open, 25s when closed
        pollRef.current = setInterval(pollChat, open ? 8000 : 25000);
        return () => clearInterval(pollRef.current);
      }, [pollChat, open]);

      useEffect(() => {
        if (open && messagesRef.current) {
          messagesRef.current.scrollTop = messagesRef.current.scrollHeight;
          setBadge(0);
        }
      }, [open, chat]);

      async function send() {
        if (!input.trim()) return;
        const msg = input;
        setInput('');
        try {
          await portalFetch(`/api/portal/${token}/message`, {
            method: 'POST',
            body: JSON.stringify({ name: chatName || 'Klant', message: msg })
          });
          await pollChat();
        } catch { alert('Versturen mislukt.'); }
      }

      // File upload in chat (images + PDF) — uploads via the portal upload
      // route, then posts a chat message referencing the file.
      const chatFileRef = useRef(null);
      async function sendFile(file) {
        if (!file) return;
        const allowed = ['image/jpeg','image/png','image/svg+xml','image/gif','image/webp','application/pdf'];
        if (!allowed.includes(file.type)) { alert('Alleen afbeeldingen en PDF toegestaan.'); return; }
        if (file.size > 10 * 1024 * 1024) { alert('Bestand te groot (max 10MB).'); return; }
        const dataBase64 = await new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onload = () => resolve(fr.result);
          fr.onerror = reject;
          fr.readAsDataURL(file);
        });
        try {
          const up = await portalFetch(`/api/portal/${token}/upload`, {
            method: 'POST',
            body: JSON.stringify({ filename: file.name, mimeType: file.type, dataBase64, size: file.size })
          });
          if (!up.ok) { const e2 = await up.json().catch(() => ({})); alert(e2.error || 'Upload mislukt.'); return; }
          await portalFetch(`/api/portal/${token}/message`, {
            method: 'POST',
            body: JSON.stringify({ name: chatName || 'Klant', message: `📎 Bestand gedeeld: ${file.name}` })
          });
          await pollChat();
        } catch { alert('Upload mislukt.'); }
      }

      return (
        <>
          <button className="chat-fab" onClick={() => setOpen(o => !o)} title="Chat met ons">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            {badge > 0 && <span className="chat-fab-badge">{badge}</span>}
          </button>
          {open && (
            <div className="chat-panel">
              <div className="chat-panel-header">
                <span className="chat-panel-title">💬 Chat met ons</span>
                <button className="chat-panel-close" onClick={() => setOpen(false)}>✕</button>
              </div>
              <div className="chat-messages" ref={messagesRef}>
                {chat.length === 0
                  ? <div style={{fontSize:12,color:'#9ca3af',textAlign:'center',padding:'20px 0'}}>Stuur een bericht om het gesprek te starten.</div>
                  : chat.map((m, i) => (
                    <div key={i}>
                      <div className={`chat-msg ${m.from==='client'?'client':'admin'}`}>{m.message}</div>
                      <div className="chat-msg-meta" style={{textAlign:m.from==='client'?'right':'left',fontSize:10,color:'#9ca3af',margin:'2px 4px'}}>
                        {m.from==='admin'?(m.name||'Accountmanager'):(m.name||'U')} · {fmtS(m.time)}
                      </div>
                    </div>
                  ))}
              </div>
              <div className="chat-name-row">
                <input type="text" placeholder="Uw naam" value={chatName}
                  onChange={e => { setChatName(e.target.value); localStorage.setItem('portalChatName', e.target.value); }} />
              </div>
              <div className="chat-input-area">
                <input ref={chatFileRef} type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={e => { sendFile(e.target.files[0]); e.target.value = ''; }} />
                <button onClick={() => chatFileRef.current?.click()} title="Bestand bijvoegen (afbeelding of PDF)" style={{background:'none',border:'none',cursor:'pointer',fontSize:17,padding:'0 4px',color:'#6b7280'}}>📎</button>
                <textarea
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                  placeholder="Schrijf een bericht..."
                  rows="1"
                  style={{height:'auto'}}
                />
                <button className="chat-send-btn" onClick={send}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          )}
        </>
      );
    }

    // ── Diensten Dashboard — overview of all active services ──────────────
    function DienstenTab({ data, onUpgrade }) {
      const svcs = (data.projectServices?.length ? data.projectServices : data.services) || [];
      const delivs = data.approvedDeliverables || [];
      const [info, setInfo] = useState(null);
      if (!svcs.length) return (
        <div className="empty-state">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          <p>Nog geen actieve diensten</p>
        </div>
      );
      function svcStatus(s) {
        const match = delivs.find(d => (d.service || '').toLowerCase() === (s.name || '').toLowerCase());
        if (match) return { label: 'Opgeleverd', color: '#15803d', bg: '#dcfce7', last: match.approvedAt || match.builtAt, next: s.billing !== 'eenmalig' ? 'Doorlopende updates' : null };
        const phase = data.currentPhase || 1;
        if (phase >= 2) return { label: 'In productie', color: '#1d4ed8', bg: '#dbeafe', last: data.projectStartedAt, next: 'Eerste oplevering volgt' };
        return { label: 'Gepland', color: '#6b7280', bg: '#f3f4f6', last: null, next: 'Start na intake' };
      }
      return (
        <div>
          <div className="inner-label" style={{marginBottom:10}}>Actieve diensten ({svcs.length})</div>
          {svcs.map((s, i) => {
            const st = svcStatus(s);
            return (
              <div key={i} style={{border:'1px solid #e5e7eb',borderRadius:10,padding:'14px 16px',marginBottom:10,background:'#fff'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
                  <div style={{flex:1,minWidth:180}}>
                    <div style={{fontSize:14,fontWeight:700}}>{s.name}</div>
                    <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>
                      €{(s.price||0).toLocaleString('nl-NL')}{s.billing==='eenmalig'?' eenmalig':'/mnd'}
                      {st.last && <> · Laatste update: {fmtS(st.last)}</>}
                      {st.next && <> · {st.next}</>}
                    </div>
                  </div>
                  <span style={{background:st.bg,color:st.color,borderRadius:99,fontSize:11,fontWeight:700,padding:'3px 11px',whiteSpace:'nowrap'}}>{st.label}</span>
                  <button onClick={() => setInfo(info === i ? null : i)} style={{fontSize:12,padding:'6px 13px',borderRadius:7,border:'1.5px solid #e5e7eb',background:'#fff',cursor:'pointer',fontFamily:'inherit',fontWeight:600}}>Meer info</button>
                </div>
                {info === i && (
                  <div style={{marginTop:10,padding:'10px 12px',background:'#f9fafb',borderRadius:8,fontSize:13,color:'#374151',lineHeight:1.6}}>
                    {s.description || 'Deze dienst is onderdeel van uw pakket. Vragen? Stuur ons een bericht via de chat.'}
                  </div>
                )}
              </div>
            );
          })}
          <button onClick={onUpgrade} style={{marginTop:8,width:'100%',padding:'13px 0',background:'var(--accent)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>+ Dienst toevoegen of upgraden</button>
        </div>
      );
    }

    function App() {
      const [data,      setData]      = useState(null);
      const [authState, setAuthState] = useState(null); // null | { requiresSetup, requiresLogin, companyName, branding }
      const [error,     setError]     = useState('');
      const [activeTab, setActiveTab] = useState('overview');
      const token = getToken();

      function loadPortal() {
        if (!token || token === 'portal') { setError('Geen portaallink gevonden.'); return; }
        // Always send JWT if we have one (lets server skip login screen for returning visitors)
        const jwtVal = getPortalJwt(token);
        const headers = { 'Content-Type': 'application/json' };
        if (jwtVal) headers['Authorization'] = 'Bearer ' + jwtVal;
        fetch(`/api/portal/${token}`, { headers })
          .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(d => {
            if (d.requiresSetup || d.requiresLogin) {
              setAuthState(d);
              // Apply branding even on auth screen
              const accentColor = d.branding?.color || null;
              if (accentColor) document.documentElement.style.setProperty('--accent', accentColor);
              return;
            }
            setAuthState(null);
            setData(d);
            const brand = d.branding || {};
            const accentColor = brand.color || d.portalThemeColor || null;
            if (accentColor) {
              document.documentElement.style.setProperty('--accent', accentColor);
              document.querySelector('meta[name="theme-color"]')?.setAttribute('content', accentColor);
            }
            const brandName = brand.name || d.agencyName || 'Agency AI';
            document.title = `${d.companyName || 'Project'} — ${brandName}`;
          })
          .catch(() => setError('Portaal niet gevonden. Controleer de link.'));
      }

      useEffect(() => { loadPortal(); }, [token]);

      // Auth screens — shown before portal loads
      if (authState?.requiresSetup) return (
        <SetupScreen
          companyName={authState.companyName}
          branding={authState.branding}
          token={token}
          onAuthSuccess={() => { setAuthState(null); loadPortal(); }}
        />
      );

      if (authState?.requiresLogin) return (
        <LoginScreen
          companyName={authState.companyName}
          branding={authState.branding}
          token={token}
          onAuthSuccess={() => { setAuthState(null); loadPortal(); }}
        />
      );

      if (error) return (
        <div className="center-page">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h2>Niet gevonden</h2><p>{error}</p>
        </div>
      );

      if (!data) return (
        <div className="center-page">
          <div className="spinner" />
          <p>Laden...</p>
        </div>
      );

      // Title set dynamically after branding loads (see fetch handler above)

      const cur      = data.currentPhase || 1;
      const payments = data.payments  || [];
      const docs     = data.documents || [];
      const openCount= payments.filter(p => p.status !== 'paid' && p.status !== 'cancelled').length;
      const svcs     = (data.projectServices?.length ? data.projectServices : data.services) || [];
      const hasMonthly = svcs.some(s => s.billing !== 'eenmalig');

      const CalSvg = () => (
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      );

      const tabs = [
        { key: 'overview',   label: 'Overzicht' },
        { key: 'diensten',   label: 'Diensten' },
        { key: 'leveringen', label: 'Leveringen' },
        { key: 'facturen',   label: <>Facturen{openCount > 0 && <span style={{background:'#ef4444',color:'#fff',borderRadius:99,fontSize:10,padding:'1px 5px',fontWeight:700,marginLeft:3}}>{openCount}</span>}</> },
        { key: 'documenten', label: <>Documenten{docs.length > 0 && <span style={{background:'var(--accent)',color:'#fff',borderRadius:99,fontSize:10,padding:'1px 5px',fontWeight:700,marginLeft:3}}>{docs.length}</span>}</> },
        { key: 'resultaten', label: 'Resultaten' },
        { key: 'berichten',  label: 'Berichten' },
        { key: 'meer',        label: '+ Meer diensten' },
        { key: 'abonnement',  label: '📋 Abonnement' },
        { key: 'profiel',     label: '👤 Profiel' },
        { key: 'activiteit',  label: '📊 Activiteit' },
        ...(data.customDomain ? [{ key: 'domein', label: <>Domein{data.customDomainStatus === 'active' ? ' ✓' : ' ⏳'}</> }] : []),
      ];

      return (
        <>
          <div className="agency-header">
            <div className="agency-logo">
              {(data.branding?.logo || data.agencyLogo)
                ? <img src={data.branding?.logo || data.agencyLogo} style={{height:32,maxWidth:120,objectFit:'contain',display:'block'}} alt={data.branding?.name || data.agencyName} />
                : <img src="/images/agency_ai_logo_dark.png" style={{height:32,maxWidth:120,objectFit:'contain',display:'block'}} alt="Agency AI" />}
            </div>
            <div className="agency-name">{data.branding?.name || data.agencyName}</div>
          </div>

          <div className="project-banner">
            <div className="company-name">{data.companyName}</div>
            <div className="company-sub">Bijgewerkt door {data.myName || data.agencyName}</div>
            <PhaseTracker current={cur} data={data} />
            {data.estimatedCompletion && (
              <div className="date-row"><CalSvg /> Verwachte afronddatum: <strong>{fmt(data.estimatedCompletion)}</strong></div>
            )}
          </div>

          {cur === 5 && (
            <div style={{margin:'14px 0',padding:'16px 18px',borderRadius:12,background:hasMonthly?'linear-gradient(135deg,#f0fdf4,#dcfce7)':'linear-gradient(135deg,#eff6ff,#dbeafe)',border:`1.5px solid ${hasMonthly?'#86efac':'#bfdbfe'}`,display:'flex',gap:12,alignItems:'flex-start'}}>
              <span style={{fontSize:22,flexShrink:0}}>{hasMonthly?'🤝':'🎉'}</span>
              <div>
                <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{hasMonthly?'We werken graag samen!':'Project afgerond!'}</div>
                <div style={{fontSize:13,color:'#374151',lineHeight:1.6}}>{hasMonthly?'Fijn dat we al een tijdje samenwerken!':'Het project is afgerond! Wil je nog een vervolgproject starten?'}</div>
              </div>
            </div>
          )}

          <div className="tabs-wrap">
            <nav className="tabs-nav">
              {tabs.map(t => (
                <button key={t.key} className={`tab-btn${activeTab===t.key?' active':''}`} onClick={() => setActiveTab(t.key)}>
                  {t.label}
                </button>
              ))}
            </nav>
            <div className="tab-pane">
              {activeTab === 'overview'   && <OverzichtTab data={data} token={token} />}
              {activeTab === 'diensten'   && <DienstenTab data={data} onUpgrade={() => setActiveTab('meer')} />}
              {activeTab === 'leveringen' && <LeveringenTab data={data} token={token} />}
              {activeTab === 'facturen'   && <FacturenTab payments={payments} />}
              {activeTab === 'documenten' && <DocumentenTab docs={docs} />}
              {activeTab === 'resultaten' && <ResultatenTab analytics={data.analytics} />}
              {activeTab === 'berichten'  && <BerichtenTab token={token} chat={data.portalChat||[]} />}
              {activeTab === 'meer'       && <MeerDienstenTab token={token} />}
              {activeTab === 'abonnement' && <AbonnementTab token={token} data={data} />}
              {activeTab === 'profiel'    && <ProfielTab token={token} data={data} />}
              {activeTab === 'activiteit' && <ActiviteitTab data={data} />}
              {activeTab === 'domein'     && <DomeinTab domain={data.customDomain} status={data.customDomainStatus} />}
            </div>
          </div>

          <ChatWidget token={token} initialChat={data.portalChat||[]} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    // ── PWA: Service worker registration ─────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/portal-sw.js').catch(() => {});
    }

    // ── PWA: Install prompt ───────────────────────────────────────────────────────
    let _installPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _installPrompt = e;
      // Show install button
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.style.display = 'flex';
    });
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.style.display = 'none';
      _installPrompt = null;
    });
    window.installPWA = function() {
      if (!_installPrompt) return;
      _installPrompt.prompt();
      _installPrompt.userChoice.then(() => { _installPrompt = null; });
    };
  </script>

  <!-- PWA install button (hidden until beforeinstallprompt fires) -->
  <style>
    #pwaInstallBtn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      z-index: 9999;
      font-family: inherit;
    }
    #pwaInstallBtn:hover { background: #4f46e5; }
  </style>
  <button id="pwaInstallBtn" onclick="installPWA()">
    📱 Installeer app
  </button>
</body>
</html>
