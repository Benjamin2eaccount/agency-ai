<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projectstatus</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/portal-manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #6366f1; --success: #10b981; --warn: #f59e0b; --danger: #ef4444;
      --border: #e5e7eb; --muted: #6b7280; --surface: #f9fafb;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f9fafb; color: #111; min-height: 100vh; padding-bottom: 48px; }
    .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }
    .agency-header { text-align: center; padding: 28px 0 20px; }
    .agency-logo { width: 44px; height: 44px; background: #111; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .agency-logo svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .agency-name { font-size: 15px; font-weight: 700; color: #111; }
    .project-banner { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; margin-bottom: 0; }
    .company-name { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
    .company-sub { font-size: 13px; color: var(--muted); }
    .phase-track { display: flex; align-items: flex-start; margin: 20px 0 10px; }
    .phase-step { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .phase-connector { flex: 1; height: 2px; margin-top: 13px; background: var(--border); transition: background 0.3s; }
    .phase-connector.done { background: var(--success); }
    .phase-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border: 2px solid var(--border); background: #fff; color: var(--muted); position: relative; z-index: 1; }
    .phase-dot.done { background: var(--success); border-color: var(--success); color: #fff; }
    .phase-dot.current { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
    .phase-label { font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 7px; text-align: center; max-width: 56px; line-height: 1.3; }
    .phase-label.done { color: var(--success); }
    .phase-label.current { color: var(--accent); font-weight: 600; }
    .progress-wrap { background: #f3f4f6; border-radius: 99px; height: 5px; margin: 4px 0 10px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(to right, var(--success), var(--accent)); transition: width 0.6s ease; }
    .phase-caption { font-size: 13px; color: var(--muted); }
    .phase-caption strong { color: #111; }
    .date-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); border-radius: 8px; font-size: 13px; margin-top: 14px; }
    .tabs-wrap { background: #fff; border: 1px solid var(--border); border-radius: 14px; margin: 14px 0 0; overflow: hidden; }
    .tabs-nav { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn { flex-shrink: 0; padding: 13px 16px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
    .tab-btn:hover { color: #111; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-pane { padding: 20px 24px; }
    .inner-section { margin-bottom: 24px; }
    .inner-section:last-child { margin-bottom: 0; }
    .inner-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
    .svc-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
    .svc-row:last-of-type { border-bottom: none; }
    .svc-price { font-weight: 600; font-size: 13px; }
    .svc-total { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 0; font-size: 14px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 4px; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .badge-paid { background: #f0fdf4; color: #16a34a; }
    .badge-pending { background: #fefce8; color: #d97706; }
    .badge-sent { background: #eff6ff; color: #2563eb; }
    .badge-overdue { background: #fef2f2; color: #dc2626; }
    .badge-cancelled { background: #f3f4f6; color: var(--muted); }
    .invoice-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .invoice-card:last-child { margin-bottom: 0; }
    .invoice-card.overdue { border-color: #fca5a5; }
    .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .invoice-desc { font-size: 14px; font-weight: 600; color: #111; }
    .invoice-amount { font-size: 15px; font-weight: 700; color: #111; }
    .invoice-meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .invoice-pay-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; background: var(--accent); color: #fff; border-radius: 7px; text-decoration: none; font-size: 12px; font-weight: 600; margin-top: 10px; }
    .invoice-pay-btn:hover { opacity: .9; }
    .faq-item { border: 1px solid #f3f4f6; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
    .faq-q { background: var(--surface); padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: #111; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .faq-a { padding: 12px 14px; font-size: 13px; color: #374151; line-height: 1.6; }
    .faq-chevron { transition: transform 0.2s; flex-shrink: 0; }
    .faq-chevron.open { transform: rotate(180deg); }
    .cal-item { padding: 10px 12px; background: var(--surface); border: 1px solid #f3f4f6; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .cal-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
    .cal-tag { border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 700; }
    .tag-week { background: #eef2ff; color: #6366f1; }
    .tag-plat { background: #f3f4f6; color: #374151; }
    .tag-type { background: #fefce8; color: #d97706; }
    .tag-time { background: #f0fdf4; color: #16a34a; }
    .cal-topic { font-weight: 700; color: #111; margin-bottom: 3px; }
    .cal-caption { color: var(--muted); line-height: 1.5; margin-bottom: 3px; }
    .cal-hashtags { color: var(--accent); font-size: 12px; }
    .milestone-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface); border: 1px solid #f3f4f6; border-radius: 8px; margin-bottom: 8px; }
    .milestone-week { background: var(--accent); color: #fff; border-radius: 5px; padding: 3px 7px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .milestone-title { font-size: 13px; font-weight: 700; color: #111; }
    .milestone-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .doc-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
    .doc-card:last-child { margin-bottom: 0; }
    .doc-card-header { display: flex; align-items: flex-start; gap: 10px; }
    .doc-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .doc-icon.link { background: #eff6ff; color: #2563eb; }
    .doc-icon.password { background: #fef3c7; color: #d97706; }
    .doc-icon.note { background: #f0fdf4; color: #16a34a; }
    .doc-title { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 2px; }
    .doc-desc { font-size: 12px; color: var(--muted); }
    .doc-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .doc-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: #111; font-family: inherit; }
    .doc-btn:hover { background: var(--surface); }
    .doc-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .doc-password-field { display: flex; align-items: center; gap: 8px; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 7px 12px; }
    .doc-password-value { font-family: monospace; font-size: 13px; flex: 1; color: #111; letter-spacing: .05em; }
    .analytics-card { border-radius: 10px; padding: 14px 16px; border: 1px solid; margin-bottom: 10px; }
    .analytics-card.green { background: #f0fdf4; border-color: #bbf7d0; }
    .analytics-card.blue { background: #eff6ff; border-color: #bfdbfe; }
    .analytics-card.purple { background: #f5f3ff; border-color: #ddd6fe; }
    .analytics-card.orange { background: #fff7ed; border-color: #fed7aa; }
    .analytics-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .analytics-card.green .analytics-card-title { color: #15803d; }
    .analytics-card.blue .analytics-card-title { color: #1d4ed8; }
    .analytics-card.purple .analytics-card-title { color: #6d28d9; }
    .analytics-card.orange .analytics-card-title { color: #c2410c; }
    .analytics-stat { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,.05); }
    .analytics-stat:last-child { border-bottom: none; }
    .analytics-stat-label { font-size: 12px; color: #374151; }
    .analytics-stat-value { font-size: 14px; font-weight: 700; color: #111; }
    .analytics-disclaimer { font-size: 11px; color: var(--muted); background: var(--surface); border-radius: 8px; padding: 10px 12px; margin-top: 16px; line-height: 1.5; }
    .msg-form .form-group { margin-bottom: 12px; }
    .msg-form .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #374151; }
    .msg-form .form-group input, .msg-form .form-group textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; color: #111; transition: border-color 0.15s; }
    .msg-form .form-group input:focus, .msg-form .form-group textarea:focus { border-color: var(--accent); }
    .msg-form .form-group textarea { min-height: 80px; resize: vertical; }
    .btn-send { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: opacity 0.15s; margin-top: 4px; }
    .btn-send:hover { opacity: 0.85; }
    .btn-send:disabled { opacity: 0.45; cursor: not-allowed; }
    .chat-fab { position: fixed; bottom: 24px; right: 20px; z-index: 1000; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(99,102,241,.45); transition: transform 0.2s; }
    .chat-fab:hover { transform: scale(1.08); }
    .chat-fab svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chat-fab-badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; background: #ef4444; color: #fff; border-radius: 99px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
    .chat-panel { position: fixed; bottom: 88px; right: 16px; width: 320px; max-height: 480px; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.14); display: flex; flex-direction: column; z-index: 999; overflow: hidden; }
    @media (max-width: 400px) { .chat-panel { width: calc(100vw - 32px); } }
    .chat-panel-header { padding: 14px 16px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: space-between; }
    .chat-panel-title { font-size: 14px; font-weight: 700; }
    .chat-panel-close { background: none; border: none; color: rgba(255,255,255,.8); cursor: pointer; font-size: 18px; line-height: 1; padding: 0; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .chat-msg.client { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-msg.admin { background: #f3f4f6; color: #111; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-msg-meta { font-size: 10px; margin-top: 3px; opacity: .65; }
    .chat-input-area { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
    .chat-input-area textarea { flex: 1; min-height: 38px; max-height: 100px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; resize: none; outline: none; }
    .chat-input-area textarea:focus { border-color: var(--accent); }
    .chat-send-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chat-send-btn:hover { opacity: .85; }
    .chat-name-row { padding: 8px 10px 0; display: flex; gap: 8px; }
    .chat-name-row input { flex: 1; height: 34px; padding: 0 10px; border: 1.5px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 12px; outline: none; }
    .chat-name-row input:focus { border-color: var(--accent); }
    .center-page { text-align: center; padding: 80px 20px; color: var(--muted); }
    .center-page h2 { font-size: 18px; color: #111; margin: 12px 0 6px; }
    .empty-state { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 13px; }
    .calendly-btn { display: inline-flex; align-items: center; gap: 8px; background: #006bff; color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; }
    .calendly-btn:hover { opacity: .9; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 26px; height: 26px; border: 2px solid #e5e7eb; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div class="container">
    <div id="root"></div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Helpers ──────────────────────────────────────────────────────────
    const PHASES = [
      { num: 1, label: 'Intake' },
      { num: 2, label: 'Uitvoering' },
      { num: 3, label: 'Oplevering & Check' },
      { num: 4, label: 'Live gaan' },
      { num: 5, label: 'Volgende stap' }
    ];

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fmt(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }); }
    function fmtS(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }); }

    function getToken() { return window.location.pathname.split('/').filter(Boolean).pop(); }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        if (btn) { const orig = btn.textContent; btn.textContent = 'Gekopieerd! ✓'; setTimeout(() => btn.textContent = orig, 2000); }
      }).catch(() => {});
    }

    // ── Phase Tracker ────────────────────────────────────────────────────
    function PhaseTracker({ current }) {
      const pct = Math.round(((current - 1) / (PHASES.length - 1)) * 100);
      const CheckIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" width="12" height="12">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      );
      return (
        <>
          <div className="phase-track">
            {PHASES.map((p, i) => {
              const done = p.num < current, cur = p.num === current;
              return (
                <React.Fragment key={p.num}>
                  <div className="phase-step">
                    <div className={`phase-dot ${done ? 'done' : cur ? 'current' : ''}`}>
                      {done ? <CheckIcon /> : p.num}
                    </div>
                    <div className={`phase-label ${done ? 'done' : cur ? 'current' : ''}`}>{p.label}</div>
                  </div>
                  {i < PHASES.length - 1 && <div className={`phase-connector${done ? ' done' : ''}`} />}
                </React.Fragment>
              );
            })}
          </div>
          <div className="progress-wrap">
            <div className="progress-fill" style={{ width: `${pct}%` }} />
          </div>
          <div className="phase-caption">
            Fase: <strong>Fase {current} — {PHASES[current - 1]?.label}</strong>
          </div>
        </>
      );
    }

    // ── Badge helpers ─────────────────────────────────────────────────────
    function PayBadge({ payment }) {
      const { status, dueDate, paidAt } = payment;
      const overdue = dueDate && !paidAt && new Date(dueDate) < new Date() && status !== 'paid';
      if (status === 'paid')     return <span className="badge badge-paid">Betaald</span>;
      if (overdue)               return <span className="badge badge-overdue">Te laat</span>;
      if (status === 'sent')     return <span className="badge badge-sent">Verzonden</span>;
      if (status === 'cancelled')return <span className="badge badge-cancelled">Geannuleerd</span>;
      return <span className="badge badge-pending">In afwachting</span>;
    }

    // ── FAQ Item (collapsible) ────────────────────────────────────────────
    function FaqItem({ question, answer }) {
      const [open, setOpen] = useState(false);
      const ChevronSvg = () => (
        <svg className={`faq-chevron${open ? ' open' : ''}`} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      );
      return (
        <div className="faq-item">
          <div className="faq-q" onClick={() => setOpen(!open)}>
            <span>{question}</span>
            <ChevronSvg />
          </div>
          {open && <div className="faq-a">{answer}</div>}
        </div>
      );
    }

    // ── Overzicht Tab ────────────────────────────────────────────────────
    function OverzichtTab({ data, token }) {
      const [stagedFiles, setStagedFiles] = useState([]);
      const [uploadMsg, setUploadMsg] = useState('');
      const [uploads, setUploads] = useState(data.clientUploads || []);
      const fileInputRef = useRef(null);

      const svcs = (data.projectServices?.length ? data.projectServices : data.services) || [];
      const monthlyTotal = svcs.filter(s => s.billing !== 'eenmalig').reduce((a, s) => a + (s.price || 0), 0);
      const onceTotal    = svcs.filter(s => s.billing === 'eenmalig').reduce((a, s) => a + (s.price || 0), 0);

      function handleFiles(files) {
        const newFiles = [];
        for (const f of files) {
          if (f.size > 10 * 1024 * 1024) { alert(f.name + ' is te groot (max 10MB)'); continue; }
          newFiles.push(f);
        }
        setStagedFiles(prev => [...prev, ...newFiles]);
        if (fileInputRef.current) fileInputRef.current.value = '';
      }

      async function submitFiles() {
        if (!stagedFiles.length) return;
        setUploadMsg('uploading');
        let anyError = false;
        for (const file of stagedFiles) {
          try {
            const dataUrl = await new Promise((res, rej) => {
              const reader = new FileReader();
              reader.onload = ev => res(ev.target.result);
              reader.onerror = rej;
              reader.readAsDataURL(file);
            });
            const resp = await fetch(`/api/portal/${token}/upload`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filename: file.name, mimeType: file.type, dataBase64: dataUrl.split(',')[1], size: file.size })
            });
            const d = await resp.json();
            if (!d.ok) { alert('Fout: ' + (d.error || 'onbekend')); anyError = true; }
          } catch { alert('Verbindingsfout bij ' + file.name); anyError = true; }
        }
        setStagedFiles([]);
        if (!anyError) {
          setUploadMsg('success');
          const r = await fetch(`/api/portal/${token}`);
          if (r.ok) { const d = await r.json(); setUploads(d.clientUploads || []); }
        } else { setUploadMsg(''); }
      }

      async function deleteFile(filename) {
        if (!confirm(`Bestand "${filename}" verwijderen?`)) return;
        const r = await fetch(`/api/portal/${token}/upload/${encodeURIComponent(filename)}`, { method: 'DELETE' });
        const d = await r.json();
        if (d.ok) setUploads(prev => prev.filter(f => f.filename !== filename));
        else alert('Verwijderen mislukt: ' + (d.error || 'onbekend'));
      }

      const CalSvg = () => (
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">

    // ── Leveringen Tab ───────────────────────────────────────────────────
    function LeveringenTab({ data, token }) {
      const [fbText, setFbText] = useState('');
      const [fbSent, setFbSent] = useState(false);
      const [showFb, setShowFb] = useState(false);

      const calItems   = data.delivery?.contentCalendar?.items || [];
      const faqs       = data.delivery?.chatbotFlow?.faqs || [];
      const milestones = data.delivery?.milestones?.milestones || [];
      const approvedDelivs = data.approvedDeliverables || [];
      const sharedFiles    = data.sharedProjectFiles || [];
      const hasSite        = !!data.generatedSite;
      const _siteUrl       = hasSite && data.generatedSite.siteUrl
        ? (data.generatedSite.siteUrl.startsWith('http') ? data.generatedSite.siteUrl : window.location.origin + data.generatedSite.siteUrl) : '';

      async function submitFeedback() {
        if (!fbText.trim()) return;
        const r = await fetch(`/api/portal/${token}/site-feedback`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ feedback: fbText })
        });
        if (r.ok) { setFbSent(true); setFbText(''); setShowFb(false); }
        else alert('Versturen mislukt.');
      }

      const hasContent = sharedFiles.length || approvedDelivs.length || calItems.length || faqs.length || milestones.length || hasSite;

      if (!hasContent) {
        return (
          <div className="empty-state">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p>Nog geen leveringen beschikbaar</p>
          </div>
        );
      }

      return (
        <div>
          {sharedFiles.length > 0 && (
            <div className="inner-section">
              <div className="inner-label">Project bestanden</div>
              {sharedFiles.map((f, i) => {
                const icon = f.type==='html'?'🌐':f.type==='document'?'📄':'📊';
                const absUrl = f.fullUrl || (f.url ? (f.url.startsWith('http') ? f.url : window.location.origin+f.url) : '');
                return (
                  <div key={i} style={{padding:12,border:'1px solid #e5e7eb',borderRadius:8,marginBottom:8,background:'#f9fafb'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{icon} {f.name}</div>
                        <div style={{fontSize:11,color:'#6b7280'}}>Toegevoegd {fmt(f.createdAt)}</div>
                      </div>
                      {absUrl && <a href={absUrl} target="_blank" rel="noopener" style={{fontSize:12,background:'#6366f1',color:'#fff',padding:'6px 14px',borderRadius:6,textDecoration:'none'}}>Bekijken →</a>}
                    </div>
                    {absUrl && f.type==='html' && (
                      <div style={{border:'1px solid #e5e7eb',borderRadius:6,overflow:'hidden',marginTop:10}}>
                        <iframe src={absUrl} style={{width:'100%',height:300,border:'none',display:'block'}} loading="lazy" sandbox="allow-scripts allow-same-origin" />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {approvedDelivs.length > 0 && (
            <div className="inner-section">
              <div className="inner-label">Gebouwde leveringen</div>
              {approvedDelivs.map((d, i) => <DeliverableCard key={i} d={d} />)}
            </div>
          )}

          {calItems.length > 0 && (
            <div className="inner-section">
              <div className="inner-label">Content kalender — Maand 1</div>
              {calItems.map((item, i) => (
                <div key={i} className="cal-item">
                  <div className="cal-tags">
                    <span className="cal-tag tag-week">Week {item.week}{item.day ? ` · ${item.day}` : ''}</span>
                    {item.platform && <span className="cal-tag tag-plat">{item.platform}</span>}
                    {item.type     && <span className="cal-tag tag-type">{item.type}</span>}
                    {item.bestTime && <span className="cal-tag tag-time">{item.bestTime}</span>}
                  </div>
                  <div className="cal-topic">{item.topic}</div>
                  {item.caption  && <div className="cal-caption">{item.caption}</div>}
                  {item.hashtags?.length > 0 && <div className="cal-hashtags">{item.hashtags.join(' ')}</div>}
                </div>
              ))}
            </div>
          )}

          {faqs.length > 0 && (
            <div className="inner-section">
              <div className="inner-label">Chatbot FAQ Script</div>
              {faqs.map((f, i) => <FaqItem key={i} question={f.question} answer={f.answer} />)}
            </div>
          )}

          {milestones.length > 0 && (
            <div className="inner-section">
              <div className="inner-label">Projectmijlpalen</div>
              {milestones.map((m, i) => (
                <div key={i} className="milestone-row">
                  <span className="milestone-week">W{m.week}</span>
                  <div>
                    <div className="milestone-title">{m.title}</div>
                    {m.description && <div className="milestone-desc">{m.description}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {hasSite && (
            <div className="inner-section">
              <div className="inner-label">Website preview</div>
              <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
                <span style={{background:data.generatedSite.status==='live'?'#16a34a':'#d97706',color:'#fff',borderRadius:4,padding:'2px 8px',fontSize:11,fontWeight:700}}>
                  {data.generatedSite.status==='live'?'Live':'Preview'}
                </span>
                <span style={{fontSize:12,color:'#6b7280'}}>Gegenereerd op {fmt(data.generatedSite.generatedAt)}</span>
              </div>
              {_siteUrl ? (
                <div style={{border:'1px solid #e5e7eb',borderRadius:8,overflow:'hidden',marginBottom:12}}>
                  <iframe src={_siteUrl} style={{width:'100%',height:300,border:'none',display:'block'}} loading="lazy" sandbox="allow-same-origin allow-scripts" />
                </div>
              ) : (
                <div style={{border:'1px solid #e5e7eb',borderRadius:8,padding:20,textAlign:'center',marginBottom:12,color:'#6b7280',fontSize:13}}>

              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>

                <button onClick={() => setShowFb(true)} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',background:'#fff',color:'#111',border:'1.5px solid #e5e7eb',borderRadius:6,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Aanpassingen doorgeven</button>
              </div>
              {showFb && !fbSent && (
                <div>
                  <textarea value={fbText} onChange={e => setFbText(e.target.value)} placeholder="Bijv: andere kleur, andere tekst..." style={{width:'100%',minHeight:80,padding:10,border:'1.5px solid #e5e7eb',borderRadius:8,fontFamily:'inherit',fontSize:13,resize:'vertical',marginBottom:8}} />
                  <button onClick={submitFeedback} className="btn-send" style={{marginTop:0}}>Verstuur aanpassingen</button>
                </div>
              )}
              {fbSent && <div style={{marginTop:10,color:'#16a34a',fontSize:13,fontWeight:600}}>✓ Aanpassingen ontvangen!</div>}
            </div>
          )}
        </div>
      );
    }

    // ── Facturen Tab ─────────────────────────────────────────────────────

        <div className="empty-state">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <p>Nog geen facturen aangemaakt</p>

        <div>

            return (
              <div key={i} className={`invoice-card${ov?' overdue':''}`}>
                <div className="invoice-header">
                  <div className="invoice-desc">{p.description || 'Factuur'}</div>
                  <div className="invoice-amount">€{(p.amount||0).toLocaleString('nl-NL')}</div>
                </div>
                <div className="invoice-meta">
                  <PayBadge payment={p} />
                  {p.dueDate && <span>Vervaldatum: {fmtS(p.dueDate)}</span>}
                  {p.paidAt  && <span style={{color:'#16a34a'}}>✓ Betaald op {fmtS(p.paidAt)}</span>}
                </div>
                {p.paymentUrl && p.status !== 'paid' && p.status !== 'cancelled' && (
                  <a href={p.paymentUrl} target="_blank" rel="noopener" className="invoice-pay-btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                    Nu betalen
                  </a>
                )}
              </div>
            );
          })}
        </div>
      );
    }

        <div className="empty-state">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <p>Nog geen documenten beschikbaar.</p>
        </div>
      );

    // ── Chat Widget ───────────────────────────────────────────────────────
    function ChatWidget({ token, initialChat }) {
      const [open, setOpen]           = useState(false);
      const [chat, setChat]           = useState(initialChat);
      const [chatName, setChatName]   = useState(localStorage.getItem('portalChatName') || '');
      const [input, setInput]         = useState('');
      const [badge, setBadge]         = useState(0);
      const messagesRef               = useRef(null);
      const pollRef                   = useRef(null);

      const pollChat = useCallback(async () => {
        try {
          const r = await fetch(`/api/portal/${token}/chat`);
          if (!r.ok) return;
          const d = await r.json();
          const c = d.chat || [];
          setChat(c);
          const adminCount = c.filter(m => m.from === 'admin').length;
          if (!open && adminCount > 0) setBadge(adminCount);
        } catch {}
      }, [token, open]);

      useEffect(() => {
        pollRef.current = setInterval(pollChat, 30000);
        return () => clearInterval(pollRef.current);
      }, [pollChat]);

      useEffect(() => {
        if (open && messagesRef.current) {
          messagesRef.current.scrollTop = messagesRef.current.scrollHeight;
          setBadge(0);
        }
      }, [open, chat]);

      async function send() {
        if (!input.trim()) return;
        const msg = input;
        setInput('');
        try {
          await fetch(`/api/portal/${token}/message`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: chatName || 'Klant', message: msg })
          });
          await pollChat();
        } catch { alert('Versturen mislukt.'); }
      }

      return (
        <>
          <button className="chat-fab" onClick={() => setOpen(o => !o)} title="Chat met ons">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            {badge > 0 && <span className="chat-fab-badge">{badge}</span>}
          </button>
          {open && (
            <div className="chat-panel">
              <div className="chat-panel-header">
                <span className="chat-panel-title">💬 Chat met ons</span>
                <button className="chat-panel-close" onClick={() => setOpen(false)}>✕</button>
              </div>
              <div className="chat-messages" ref={messagesRef}>
                {chat.length === 0
                  ? <div style={{fontSize:12,color:'#9ca3af',textAlign:'center',padding:'20px 0'}}>Stuur een bericht om het gesprek te starten.</div>
                  : chat.map((m, i) => (
                    <div key={i}>
                      <div className={`chat-msg ${m.from==='client'?'client':'admin'}`}>{m.message}</div>
                      <div className="chat-msg-meta" style={{textAlign:m.from==='client'?'right':'left',fontSize:10,color:'#9ca3af',margin:'2px 4px'}}>
                        {m.from==='admin'?(m.name||'Accountmanager'):(m.name||'U')} · {fmtS(m.time)}
                      </div>
                    </div>
                  ))}
              </div>
              <div className="chat-name-row">
                <input type="text" placeholder="Uw naam" value={chatName}
                  onChange={e => { setChatName(e.target.value); localStorage.setItem('portalChatName', e.target.value); }} />
              </div>
              <div className="chat-input-area">
                <textarea
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                  placeholder="Schrijf een bericht..."
                  rows="1"
                  style={{height:'auto'}}
                />
                <button className="chat-send-btn" onClick={send}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          )}
        </>
      );
    }

    function MeerDienstenTab({ token }) {
      const [services, setServices] = React.useState([]);

        fetch('/api/portal/' + token + '/order-service', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ serviceName: svc.name, servicePrice: svc.price }) })
          .then(r => r.json()).then(() => { setOrdered(prev => new Set([...prev, svc.name])); alert('✅ Aanvraag verstuurd! We nemen binnen 24 uur contact op.'); });
      }
      if (loading) return React.createElement('div', {style:{padding:'40px',textAlign:'center',color:'var(--muted)'}}, 'Laden...');

        React.createElement('h3', {style:{fontWeight:700,marginBottom:8}}, '+ Meer diensten'),

              React.createElement('button', {
                onClick:() => order(svc),
                disabled: ordered.has(svc.name),

    function ProfielTab({ token, data }) {
      const [form, setForm] = React.useState({ contactName: data.contactName||'', phone: data.phone||'', address: data.address||'' });
      const [pwForm, setPwForm] = React.useState({ newPw: '', confirmPw: '' });
      const [saved, setSaved] = React.useState(false);
      async function saveProfile() {
        await fetch(`/api/portal/${token}/profile`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form) });
        setSaved(true); setTimeout(() => setSaved(false), 3000);
      }
      async function changePassword() {
        if (!pwForm.newPw || pwForm.newPw.length < 6) { alert('Wachtwoord minimaal 6 tekens'); return; }
        if (pwForm.newPw !== pwForm.confirmPw) { alert('Wachtwoorden komen niet overeen'); return; }
        const r = await fetch(`/api/portal/${token}/change-password`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ newPassword: pwForm.newPw }) });
        if (r.ok) { alert('Wachtwoord gewijzigd'); setPwForm({ newPw:'', confirmPw:'' }); }
        else alert('Wijzigen mislukt');
      }
      return React.createElement('div', {style:{padding:'24px 0'}},
        React.createElement('h3', {style:{fontWeight:700,marginBottom:16}}, '👤 Mijn profiel'),
        saved && React.createElement('div', {style:{background:'#dcfce7',border:'1px solid #16a34a',borderRadius:8,padding:10,marginBottom:16,color:'#15803d',fontSize:13}}, '✓ Opgeslagen'),
        React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:12,marginBottom:24}},
          React.createElement('div', null,
            React.createElement('label', {style:{fontSize:12,fontWeight:600,display:'block',marginBottom:4}}, 'Naam'),
            React.createElement('input', {className:'input-field',style:{width:'100%'},value:form.contactName,onChange:e=>setForm({...form,contactName:e.target.value}),placeholder:'Uw naam'})
          ),
          React.createElement('div', null,
            React.createElement('label', {style:{fontSize:12,fontWeight:600,display:'block',marginBottom:4}}, 'Telefoon'),
            React.createElement('input', {className:'input-field',style:{width:'100%'},value:form.phone,onChange:e=>setForm({...form,phone:e.target.value}),placeholder:'Telefoonnummer'})
          ),
          React.createElement('div', null,
            React.createElement('label', {style:{fontSize:12,fontWeight:600,display:'block',marginBottom:4}}, 'Adres'),
            React.createElement('input', {className:'input-field',style:{width:'100%'},value:form.address,onChange:e=>setForm({...form,address:e.target.value}),placeholder:'Straat, plaats'})
          )
        ),
        React.createElement('button', {onClick:saveProfile,style:{background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,padding:'10px 24px',fontWeight:600,cursor:'pointer',marginBottom:32}}, 'Opslaan'),
        React.createElement('h4', {style:{fontWeight:700,marginBottom:12}}, '🔒 Wachtwoord wijzigen'),
        React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:10}},
          React.createElement('input', {type:'password',className:'input-field',placeholder:'Nieuw wachtwoord',value:pwForm.newPw,onChange:e=>setPwForm({...pwForm,newPw:e.target.value})}),
          React.createElement('input', {type:'password',className:'input-field',placeholder:'Herhaal wachtwoord',value:pwForm.confirmPw,onChange:e=>setPwForm({...pwForm,confirmPw:e.target.value})}),
          React.createElement('button', {onClick:changePassword,style:{background:'#374151',color:'#fff',border:'none',borderRadius:8,padding:'10px 24px',fontWeight:600,cursor:'pointer',alignSelf:'flex-start'}}, 'Wachtwoord wijzigen')
        )
      );
    }

    // ── Task 28 — Activity log ────────────────────────────────────────────────────
    function ActiviteitTab({ data }) {
      const events = [];
      const add = (at, icon, text) => { if (at) events.push({ at, icon, text }); };
      add(data.projectStartedAt, '🚀', 'Project gestart');
      add(data.intakeSubmittedAt, '📋', 'Intake ingevuld');
      (data.approvedDeliverables||[]).forEach(d => add(d.approvedAt||d.builtAt, '✅', `Levering goedgekeurd: ${d.service||''}`));
      (data.billing?.payments||[]).filter(p=>p.paidAt).forEach(p => add(p.paidAt, '💰', `Betaling ontvangen: €${p.amount||0}`));
      events.sort((a,b) => new Date(b.at)-new Date(a.at));

      if (!events.length) return React.createElement('div', {style:{padding:'40px',textAlign:'center',color:'var(--muted)'}}, 'Geen activiteit gevonden.');
      return React.createElement('div', {style:{padding:'16px 0'}},
        React.createElement('h3', {style:{fontWeight:700,marginBottom:16}}, '📊 Activiteit'),
        events.map((e,i) => React.createElement('div', {key:i, style:{display:'flex',gap:10,paddingBottom:16,borderBottom:'1px solid var(--border)',marginBottom:16}},
          React.createElement('div', {style:{fontSize:24,flexShrink:0}}, e.icon),
          React.createElement('div', null,
            React.createElement('div', {style:{fontWeight:600,fontSize:13}}, e.text),
            React.createElement('div', {style:{fontSize:11,color:'var(--muted)',marginTop:2}}, new Date(e.at).toLocaleDateString('nl-NL'))
          )
        ))
      );
    }

    function App() {
      const [data, setData]       = useState(null);
      const [error, setError]     = useState('');
      const [activeTab, setActiveTab] = useState('overview');
      const token = getToken();

      useEffect(() => {
        if (!token || token === 'portal') { setError('Geen portaallink gevonden.'); return; }
        fetch(`/api/portal/${token}`)
          .then(r => { if (!r.ok) throw new Error(); return r.json(); })
          .then(d => {
            setData(d);
            // Task 21 — Apply custom portal theme color
            if (d.portalThemeColor) {
              document.documentElement.style.setProperty('--accent', d.portalThemeColor);
            }
          })
          .catch(() => setError('Portaal niet gevonden. Controleer de link.'));
      }, [token]);

      if (error) return (
        <div className="center-page">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h2>Niet gevonden</h2><p>{error}</p>
        </div>
      );

      if (!data) return (
        <div className="center-page">
          <div className="spinner" />
          <p>Laden...</p>
        </div>
      );

      document.title = `Projectstatus – ${data.companyName || ''}`;

      const cur      = data.currentPhase || 1;
      const payments = data.payments  || [];
      const docs     = data.documents || [];
      const openCount= payments.filter(p => p.status !== 'paid' && p.status !== 'cancelled').length;
      const svcs     = (data.projectServices?.length ? data.projectServices : data.services) || [];
      const hasMonthly = svcs.some(s => s.billing !== 'eenmalig');

      const CalSvg = () => (
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      );

      const tabs = [
        { key: 'overview',   label: 'Overzicht' },
        { key: 'leveringen', label: 'Leveringen' },
        { key: 'facturen',   label: <>Facturen{openCount > 0 && <span style={{background:'#ef4444',color:'#fff',borderRadius:99,fontSize:10,padding:'1px 5px',fontWeight:700,marginLeft:3}}>{openCount}</span>}</> },
        { key: 'documenten', label: <>Documenten{docs.length > 0 && <span style={{background:'var(--accent)',color:'#fff',borderRadius:99,fontSize:10,padding:'1px 5px',fontWeight:700,marginLeft:3}}>{docs.length}</span>}</> },
        { key: 'resultaten', label: 'Resultaten' },
        { key: 'berichten',  label: 'Berichten' },
        { key: 'meer',        label: '+ Meer diensten' },
        { key: 'abonnement',  label: '📋 Abonnement' },
        { key: 'profiel',     label: '👤 Profiel' },
        { key: 'activiteit',  label: '📊 Activiteit' },
        ...(data.customDomain ? [{ key: 'domein', label: <>Domein{data.customDomainStatus === 'active' ? ' ✓' : ' ⏳'}</> }] : []),
      ];

      return (
        <>
          <div className="agency-header">
            <div className="agency-logo">
              {data.agencyLogo
                ? <img src={data.agencyLogo} style={{width:26,height:26,objectFit:'contain',borderRadius:4}} alt={data.agencyName} />
                : <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>}
            </div>
            <div className="agency-name">{data.agencyName}</div>
          </div>

          <div className="project-banner">
            <div className="company-name">{data.companyName}</div>
            <div className="company-sub">Bijgewerkt door {data.myName || data.agencyName}</div>
            <PhaseTracker current={cur} />
            {data.estimatedCompletion && (
              <div className="date-row"><CalSvg /> Verwachte afronddatum: <strong>{fmt(data.estimatedCompletion)}</strong></div>
            )}
          </div>

          {cur === 5 && (
            <div style={{margin:'14px 0',padding:'16px 18px',borderRadius:12,background:hasMonthly?'linear-gradient(135deg,#f0fdf4,#dcfce7)':'linear-gradient(135deg,#eff6ff,#dbeafe)',border:`1.5px solid ${hasMonthly?'#86efac':'#bfdbfe'}`,display:'flex',gap:12,alignItems:'flex-start'}}>
              <span style={{fontSize:22,flexShrink:0}}>{hasMonthly?'🤝':'🎉'}</span>
              <div>
                <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{hasMonthly?'We werken graag samen!':'Project afgerond!'}</div>
                <div style={{fontSize:13,color:'#374151',lineHeight:1.6}}>{hasMonthly?'Fijn dat we al een tijdje samenwerken!':'Het project is afgerond! Wil je nog een vervolgproject starten?'}</div>
              </div>
            </div>
          )}

          <div className="tabs-wrap">
            <nav className="tabs-nav">
              {tabs.map(t => (
                <button key={t.key} className={`tab-btn${activeTab===t.key?' active':''}`} onClick={() => setActiveTab(t.key)}>
                  {t.label}
                </button>
              ))}
            </nav>
            <div className="tab-pane">
              {activeTab === 'overview'   && <OverzichtTab data={data} token={token} />}
              {activeTab === 'leveringen' && <LeveringenTab data={data} token={token} />}
              {activeTab === 'facturen'   && <FacturenTab payments={payments} />}
              {activeTab === 'documenten' && <DocumentenTab docs={docs} />}
              {activeTab === 'resultaten' && <ResultatenTab analytics={data.analytics} />}
              {activeTab === 'berichten'  && <BerichtenTab token={token} chat={data.portalChat||[]} />}
              {activeTab === 'meer'       && <MeerDienstenTab token={token} />}
              {activeTab === 'abonnement' && <AbonnementTab token={token} data={data} />}
              {activeTab === 'profiel'    && <ProfielTab token={token} data={data} />}
              {activeTab === 'activiteit' && <ActiviteitTab data={data} />}
              {activeTab === 'domein'     && <DomeinTab domain={data.customDomain} status={data.customDomainStatus} />}
            </div>
          </div>

          <ChatWidget token={token} initialChat={data.portalChat||[]} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    // ── PWA: Service worker registration ─────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/portal-sw.js').catch(() => {});
    }

    // ── PWA: Install prompt ───────────────────────────────────────────────────────
    let _installPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _installPrompt = e;
      // Show install button
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.style.display = 'flex';
    });
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.style.display = 'none';
      _installPrompt = null;
    });
    window.installPWA = function() {
      if (!_installPrompt) return;
      _installPrompt.prompt();
      _installPrompt.userChoice.then(() => { _installPrompt = null; });
    };
  </script>

  <!-- PWA install button (hidden until beforeinstallprompt fires) -->
  <style>
    #pwaInstallBtn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      z-index: 9999;
      font-family: inherit;
    }
    #pwaInstallBtn:hover { background: #4f46e5; }
  </style>
  <button id="pwaInstallBtn" onclick="installPWA()">
    📱 Installeer app
  </button>
</body>
</html>
