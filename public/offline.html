<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geen verbinding — Agency AI Portaal</title>
  <link rel="icon" href="/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; display: block; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #f3f4f6; }
    p { font-size: 14px; color: #9ca3af; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #4f46e5; }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📡</span>
    <h1>Je bent offline</h1>
    <p>Er is geen internetverbinding. Controleer je wifi of mobiele data en probeer het opnieuw.</p>
    <button class="btn" onclick="window.location.reload()">🔄 Opnieuw proberen</button>
    <div class="status" id="statusText">Controleren op verbinding...</div>
  </div>
  <script>
    // Auto-retry when connection restored
    window.addEventListener('online', () => { window.location.reload(); });
    document.getElementById('statusText').textContent = navigator.onLine
      ? 'Verbinding hersteld — pagina opnieuw laden...'
      : 'Geen internetverbinding gedetecteerd';
    if (navigator.onLine) setTimeout(() => window.location.reload(), 1000);
  </script>
</body>
</html>
