<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency AI — Selecteer account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #131320;
      --surface2:  #0f1019;
      --border:    #1e2035;
      --border2:   #252840;
      --indigo:    #6366f1;
      --indigo-d:  #4f46e5;
      --indigo-xl: rgba(99,102,241,.12);
      --text:      #f1f5f9;
      --text-2:    #94a3b8;
      --text-3:    #475569;
      --text-4:    #2d3a52;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      -webkit-app-region: drag;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 28px 0;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--indigo) 0%, #8b5cf6 100%);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99,102,241,.35);
    }

    .app-name {
      font-size: 16px; font-weight: 700; color: var(--text);
      letter-spacing: -.2px;
    }

    .version-pill {
      margin-left: auto;
      font-size: 11px; color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      -webkit-app-region: no-drag;
    }

    /* ── Page heading ────────────────────────────────────────────────────── */
    .heading-wrap {
      padding: 22px 28px 18px;
      flex-shrink: 0;
    }

    .heading {
      font-size: 22px; font-weight: 800; color: var(--text);
      letter-spacing: -.4px;
    }

    .sub-heading {
      margin-top: 4px;
      font-size: 13px; color: var(--text-3);
    }

    /* ── Cards grid ──────────────────────────────────────────────────────── */
    .cards-area {
      flex: 1;
      padding: 0 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-content: start;
    }

    .cards-area::-webkit-scrollbar { width: 4px; }
    .cards-area::-webkit-scrollbar-track { background: transparent; }
    .cards-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    /* Account card */
    .acc-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      cursor: default;
      transition: border-color .18s, box-shadow .18s, transform .13s;
      -webkit-app-region: no-drag;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 170px;
      animation: cardIn .25s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .acc-card:hover {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px var(--indigo-xl), 0 4px 16px rgba(0,0,0,.35);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex; align-items: flex-start; gap: 11px;
    }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
      flex-shrink: 0;
    }

    .card-meta { flex: 1; min-width: 0; }

    .card-name {
      font-size: 13.5px; font-weight: 700; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      line-height: 1.3;
    }

    .card-last {
      margin-top: 2px;
      font-size: 11px; color: var(--text-4);
    }

    .role-badge {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .5px;
      align-self: flex-start;
    }

    .role-admin    { background: rgba(99,102,241,.15);  color: #a5b4fc; }
    .role-employee { background: rgba(59,130,246,.15);  color: #93c5fd; }
    .role-client   { background: rgba(232,108,44,.15);  color: #fdba74; }

    .card-url {
      font-size: 11px; color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .card-actions {
      display: flex; gap: 8px; margin-top: auto;
    }

    .btn-open {
      flex: 1;
      background: var(--indigo); color: #fff;
      border: none; border-radius: 9px;
      height: 34px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s, transform .1s;
      font-family: inherit;
    }
    .btn-open:hover  { background: var(--indigo-d); }
    .btn-open:active { transform: scale(.97); }

    .btn-del {
      width: 34px; height: 34px;
      background: transparent; color: var(--text-3);
      border: 1.5px solid var(--border); border-radius: 9px;
      cursor: pointer; font-size: 16px; line-height: 1;
      transition: all .15s; font-family: inherit;
    }
    .btn-del:hover { background: rgba(248,113,113,.1); color: #f87171; border-color: #f87171; }

    /* Add card */
    .add-card {
      background: transparent;
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: border-color .18s, background .18s;
      -webkit-app-region: no-drag;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 170px;
    }
    .add-card:hover { border-color: var(--indigo); background: var(--indigo-xl); }

    .add-icon-ring {
      width: 42px; height: 42px;
      border: 2px dashed var(--border2);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: var(--text-3);
      transition: border-color .18s, color .18s;
    }
    .add-card:hover .add-icon-ring { border-color: var(--indigo); color: #a5b4fc; }

    .add-label {
      font-size: 12.5px; font-weight: 600; color: var(--text-3);
      text-align: center; line-height: 1.45;
    }
    .add-card:hover .add-label { color: #a5b4fc; }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    .footer {
      display: flex; align-items: center;
      padding: 14px 28px;
      border-top: 1px solid #0e101a;
      flex-shrink: 0;
      gap: 16px;
    }

    .footer-link {
      font-size: 12px; color: var(--text-4);
      cursor: pointer; transition: color .15s;
      -webkit-app-region: no-drag;
    }
    .footer-link:hover { color: var(--indigo); }

    /* ── Empty / Loading states ──────────────────────────────────────────── */
    .state-msg {
      grid-column: 1/-1;
      text-align: center;
      padding: 50px 20px;
      color: var(--text-3);
      font-size: 13px;
    }

    /* ── Add-account modal (Step 4 will fill this in) ────────────────────── */
    #addModal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    #addModal.open { display: flex; }

    .modal-box {
      background: #131320;
      border: 1.5px solid var(--border2);
      border-radius: 16px;
      padding: 28px;
      width: 400px;
      animation: modalIn .2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      font-size: 17px; font-weight: 800; color: var(--text);
      margin-bottom: 20px;
    }

    .form-row { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px; font-weight: 600; color: var(--text-2);
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px;
    }
    .form-input, .form-select {
      width: 100%;
      background: #0a0a0f; color: var(--text);
      border: 1.5px solid var(--border2); border-radius: 9px;
      padding: 10px 12px; font-size: 13px; font-family: inherit;
      transition: border-color .15s;
      outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--indigo); }

    .color-row {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .color-swatch {
      width: 28px; height: 28px; border-radius: 7px;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color .15s, transform .1s;
    }
    .color-swatch.active, .color-swatch:hover {
      border-color: #fff;
      transform: scale(1.15);
    }

    .modal-actions {
      display: flex; gap: 10px; margin-top: 22px;
    }
    .btn-modal-cancel {
      flex: 1;
      background: transparent; color: var(--text-2);
      border: 1.5px solid var(--border2); border-radius: 9px;
      height: 38px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: border-color .15s;
    }
    .btn-modal-cancel:hover { border-color: var(--text-3); }
    .btn-modal-save {
      flex: 1;
      background: var(--indigo); color: #fff;
      border: none; border-radius: 9px;
      height: 38px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background .15s;
    }
    .btn-modal-save:hover { background: var(--indigo-d); }
  </style>
</head>
<body>
  <div class="shell">

    <!-- Top bar -->
    <div class="topbar">
      <div class="logo-mark">A</div>
      <span class="app-name">Agency AI</span>
      <span class="version-pill" id="versionPill">v1.0.0</span>
    </div>

    <!-- Heading -->
    <div class="heading-wrap">
      <div class="heading">Selecteer een account</div>
      <div class="sub-heading">Kies een werkruimte om te openen</div>
    </div>

    <!-- Cards -->
    <div class="cards-area" id="cardsArea">
      <div class="state-msg">Laden…</div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-link" id="manageLink">Beheer accounts</span>
      <span style="flex:1"></span>
      <span class="footer-link" id="websiteLink">agencyai.info ↗</span>
    </div>

  </div><!-- .shell -->

  <!-- Add-account modal -->
  <div id="addModal">
    <div class="modal-box">
      <div class="modal-title">+ Nieuw account toevoegen</div>

      <div class="form-row">
        <label class="form-label">Account naam</label>
        <input id="fName" class="form-input" placeholder="bijv. Mijn Agency" maxlength="60">
      </div>

      <div class="form-row">
        <label class="form-label">Type</label>
        <select id="fRole" class="form-select">
          <option value="admin">Admin</option>
          <option value="employee">Medewerker</option>
          <option value="client">Klant</option>
        </select>
      </div>

      <div class="form-row">
        <label class="form-label">URL</label>
        <input id="fUrl" class="form-input" placeholder="https://www.agencyai.info/app/">
      </div>

      <div class="form-row">
        <label class="form-label">Kleur</label>
        <div class="color-row" id="colorRow">
          <!-- swatches injected by JS -->
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" id="btnCancel">Annuleren</button>
        <button class="btn-modal-save"   id="btnSave">Toevoegen</button>
      </div>
    </div>
  </div>

  <script>
    /* global ipcRenderer, shell injected via nodeIntegration */
    const { ipcRenderer, shell } = require('electron')

    // ── Constants ─────────────────────────────────────────────────────────────
    const ROLE_LABELS = { admin: 'Admin', employee: 'Medewerker', client: 'Klant' }
    const PRESET_COLORS = ['#6366f1','#3B82F6','#E86C2C','#10b981','#f59e0b','#ec4899']
    const DEFAULT_URLS = {
      admin:    'https://www.agencyai.info/app/',
      employee: 'https://www.agencyai.info/app/',
      client:   'https://www.agencyai.info/portal?token=',
    }
    let selectedColor = '#6366f1'
    let _accounts = []

    // ── Helpers ───────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function relTime(iso) {
      if (!iso) return 'Nog nooit geopend'
      const diff = Date.now() - new Date(iso).getTime()
      const m = Math.floor(diff / 60000)
      if (m <  1) return 'Zojuist'
      if (m < 60) return `${m} min geleden`
      const h = Math.floor(m / 60)
      if (h < 24) return `${h} uur geleden`
      const d = Math.floor(h / 24)
      return d === 1 ? 'Gisteren' : `${d} dagen geleden`
    }

    function initials(name) {
      return (name || '?').split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2)
    }

    // ── Render cards ──────────────────────────────────────────────────────────
    function render(accounts) {
      _accounts = accounts
      const area = document.getElementById('cardsArea')
      area.innerHTML = ''

      if (!accounts.length) {
        area.innerHTML = '<div class="state-msg">Geen accounts — voeg er een toe via het + kaartje.</div>'
      }

      accounts.forEach((acc, i) => {
        const card = document.createElement('div')
        card.className = 'acc-card'
        card.style.animationDelay = `${i * 40}ms`
        card.innerHTML = `
          <div class="card-top">
            <div class="avatar" style="background:${esc(acc.color || '#6366f1')}">${esc(initials(acc.name))}</div>
            <div class="card-meta">
              <div class="card-name" title="${esc(acc.name)}">${esc(acc.name)}</div>
              <div class="card-last">${relTime(acc.lastUsed)}</div>
            </div>
          </div>
          <span class="role-badge role-${esc(acc.role)}">${esc(ROLE_LABELS[acc.role] || acc.role)}</span>
          <div class="card-url" title="${esc(acc.url)}">${esc(acc.url)}</div>
          <div class="card-actions">
            <button class="btn-open">Open →</button>
            <button class="btn-del" title="Verwijder account">×</button>
          </div>
        `
        card.querySelector('.btn-open').addEventListener('click', () => openAccount(acc))
        card.querySelector('.btn-del').addEventListener('click', (e) => {
          e.stopPropagation()
          removeAccount(acc)
        })
        area.appendChild(card)
      })

      // "+" add card
      const addCard = document.createElement('div')
      addCard.className = 'add-card'
      addCard.innerHTML = `
        <div class="add-icon-ring">+</div>
        <div class="add-label">Nieuw account<br>toevoegen</div>
      `
      addCard.addEventListener('click', showAddModal)
      area.appendChild(addCard)
    }

    // ── Account actions ───────────────────────────────────────────────────────
    async function openAccount(acc) {
      await ipcRenderer.invoke('open-account', acc)
    }

    async function removeAccount(acc) {
      if (!window.confirm(`Account "${acc.name}" verwijderen?`)) return
      const updated = await ipcRenderer.invoke('delete-account', acc.id)
      render(updated)
    }

    // ── Add modal ─────────────────────────────────────────────────────────────
    function buildColorSwatches() {
      const row = document.getElementById('colorRow')
      row.innerHTML = ''
      PRESET_COLORS.forEach(c => {
        const sw = document.createElement('div')
        sw.className = 'color-swatch' + (c === selectedColor ? ' active' : '')
        sw.style.background = c
        sw.title = c
        sw.addEventListener('click', () => {
          selectedColor = c
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'))
          sw.classList.add('active')
        })
        row.appendChild(sw)
      })
    }

    function showAddModal() {
      selectedColor = '#6366f1'
      document.getElementById('fName').value = ''
      document.getElementById('fRole').value = 'admin'
      document.getElementById('fUrl').value  = DEFAULT_URLS.admin
      buildColorSwatches()
      document.getElementById('addModal').classList.add('open')
      document.getElementById('fName').focus()
    }

    function hideAddModal() {
      document.getElementById('addModal').classList.remove('open')
    }

    async function saveNewAccount() {
      const name = document.getElementById('fName').value.trim()
      const role = document.getElementById('fRole').value
      const url  = document.getElementById('fUrl').value.trim()
      if (!name) { document.getElementById('fName').focus(); return }
      if (!url)  { document.getElementById('fUrl').focus();  return }
      const updated = await ipcRenderer.invoke('add-account', { name, role, url, color: selectedColor })
      hideAddModal()
      render(updated)
    }

    // Auto-fill URL when role changes
    document.getElementById('fRole').addEventListener('change', (e) => {
      document.getElementById('fUrl').value = DEFAULT_URLS[e.target.value] || DEFAULT_URLS.admin
    })

    document.getElementById('btnCancel').addEventListener('click', hideAddModal)
    document.getElementById('btnSave').addEventListener('click', saveNewAccount)

    // Close modal on backdrop click
    document.getElementById('addModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('addModal')) hideAddModal()
    })

    // Enter key in inputs
    document.getElementById('fName').addEventListener('keydown', e => { if (e.key === 'Enter') saveNewAccount() })
    document.getElementById('fUrl').addEventListener('keydown',  e => { if (e.key === 'Enter') saveNewAccount() })

    // Footer links
    document.getElementById('websiteLink').addEventListener('click', () => {
      shell.openExternal('https://www.agencyai.info')
    })
    document.getElementById('manageLink').addEventListener('click', showAddModal)

    // ── Boot ─────────────────────────────────────────────────────────────────
    ;(async () => {
      try {
        const pkg = require('../package.json')
        document.getElementById('versionPill').textContent = `v${pkg.version}`
      } catch {}

      const accounts = await ipcRenderer.invoke('get-accounts')
      render(accounts)
    })()
  </script>
</body>
</html>
