<!-- COMPONENT: hero-dark | Placeholders: {{COMPANY_NAME}}, {{PRIMARY_COLOR}}, {{TAGLINE}}, {{PHONE}} -->
<style>
  .hero-dark { background: #0a0a0f; color: #fff; min-height: 90vh; display: flex; align-items: center; padding: 60px 24px; position: relative; overflow: hidden; }
  .hero-dark::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, {{PRIMARY_COLOR}}33 0%, transparent 70%); }
  .hero-dark .inner { max-width: 760px; margin: 0 auto; text-align: center; position: relative; z-index: 1; }
  .hero-dark h1 { font-size: clamp(2rem,5vw,4rem); font-weight: 800; line-height: 1.1; margin-bottom: 20px; }
  .hero-dark p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 36px; max-width: 540px; margin-left: auto; margin-right: auto; }
  .hero-dark .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .hero-dark .btn-p { background: {{PRIMARY_COLOR}}; color: #fff; padding: 14px 32px; border-radius: 10px; font-weight: 700; text-decoration: none; }
  .hero-dark .btn-o { border: 2px solid rgba(255,255,255,.2); color: #fff; padding: 14px 32px; border-radius: 10px; font-weight: 600; text-decoration: none; }
</style>
<section class="hero-dark">
  <div class="inner">
    <h1>Welkom bij <span style="color:{{PRIMARY_COLOR}}">{{COMPANY_NAME}}</span></h1>
    <p>{{TAGLINE}}</p>
    <div class="cta-row">
      <a href="#contact" class="btn-p">Gratis adviesgesprek →</a>
      <a href="tel:{{PHONE}}" class="btn-o">📞 Bel ons</a>
    </div>
  </div>
</section>
