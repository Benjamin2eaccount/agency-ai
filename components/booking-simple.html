<!-- COMPONENT: booking-simple | Placeholders: {{COMPANY_NAME}}, {{PRIMARY_COLOR}}, {{PHONE}}, {{EMAIL}} -->
<style>
  .booking-wrap { padding: 80px 24px; background: #fff; }
  .booking-wrap .inner { max-width: 520px; margin: 0 auto; text-align: center; }
  .booking-wrap h2 { font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
  .booking-wrap p { color: #6b7280; margin-bottom: 32px; }
  .booking-wrap .service-card { border: 2px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; text-align: left; cursor: pointer; transition: border-color .2s; }
  .booking-wrap .service-card:hover, .booking-wrap .service-card.selected { border-color: {{PRIMARY_COLOR}}; }
  .booking-wrap .service-name { font-weight: 700; }
  .booking-wrap .service-price { color: {{PRIMARY_COLOR}}; font-weight: 600; }
  .booking-wrap .btn { background: {{PRIMARY_COLOR}}; color: #fff; padding: 14px 32px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 16px; }
</style>
<section id="boeken" class="booking-wrap">
  <div class="inner">
    <h2>Plan een Afspraak</h2>
    <p>Kies een dienst en vul uw gegevens in.</p>
    <div class="service-card" onclick="this.classList.toggle('selected')">
      <div class="service-name">Gratis Kennismaking</div>
      <div class="service-price">Gratis — 30 min</div>
    </div>
    <div class="service-card" onclick="this.classList.toggle('selected')">
      <div class="service-name">Adviesgesprek</div>
      <div class="service-price">€75 — 60 min</div>
    </div>
    <input style="width:100%;padding:12px 16px;border:1px solid #e5e7eb;border-radius:8px;font-size:1rem;margin-bottom:12px;font-family:inherit" type="text" placeholder="Uw naam">
    <input style="width:100%;padding:12px 16px;border:1px solid #e5e7eb;border-radius:8px;font-size:1rem;font-family:inherit" type="email" placeholder="Uw emailadres">
    <button class="btn">Afspraak bevestigen →</button>
  </div>
</section>
