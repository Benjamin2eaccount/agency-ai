<!-- COMPONENT: contact-form | Placeholders: {{COMPANY_NAME}}, {{PRIMARY_COLOR}}, {{EMAIL}}, {{PHONE}} -->
<style>
  .contact-form-wrap { padding: 80px 24px; background: #fff; }
  .contact-form-wrap .inner { max-width: 560px; margin: 0 auto; }
  .contact-form-wrap h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
  .contact-form-wrap p { color: #6b7280; margin-bottom: 32px; }
  .contact-form-wrap input, .contact-form-wrap textarea, .contact-form-wrap select { width: 100%; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; font-family: inherit; }
  .contact-form-wrap textarea { min-height: 120px; resize: vertical; }
  .contact-form-wrap button { background: {{PRIMARY_COLOR}}; color: #fff; padding: 14px 32px; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; }
</style>
<section id="contact" class="contact-form-wrap">
  <div class="inner">
    <h2>Neem Contact Op</h2>
    <p>Vul het formulier in en we nemen binnen 24 uur contact op.</p>
    <form onsubmit="event.preventDefault();this.innerHTML='<p style=color:green;font-weight:700>✓ Bericht verzonden! We nemen snel contact op.</p>'">
      <input type="text" name="name" placeholder="Uw naam" required>
      <input type="email" name="email" placeholder="Uw emailadres" required>
      <input type="tel" name="phone" placeholder="Telefoonnummer">
      <textarea name="message" placeholder="Uw bericht of vraag" required></textarea>
      <button type="submit">Verstuur bericht →</button>
    </form>
  </div>
</section>
