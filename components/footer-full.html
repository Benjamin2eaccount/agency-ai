<style>

  .footer-full h4 { color: #fff; font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
  .footer-full p, .footer-full a { font-size: .9rem; line-height: 1.8; color: #9ca3af; text-decoration: none; display: block; }
  .footer-full a:hover { color: {{PRIMARY_COLOR}}; }
  .footer-full .bottom { text-align: center; padding-top: 24px; border-top: 1px solid #2d2d2d; font-size: .85rem; }
  @media (max-width: 600px) { .footer-full .grid { grid-template-columns: 1fr; } }
</style>
<footer class="footer-full">

      <h4>{{COMPANY_NAME}}</h4>

    </div>
    <div>
      <h4>Contact</h4>

      <a href="mailto:{{EMAIL}}">✉️ {{EMAIL}}</a>

    <div>

</footer>
