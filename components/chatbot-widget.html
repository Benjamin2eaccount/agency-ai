<!-- COMPONENT: chatbot-widget | Placeholders: {{COMPANY_NAME}}, {{PRIMARY_COLOR}}, {{EMAIL}} -->
<style>
  .chat-fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: {{PRIMARY_COLOR}}; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 20px {{PRIMARY_COLOR}}66; z-index: 999; font-size: 24px; }
  .chat-panel { position: fixed; bottom: 92px; right: 24px; width: 320px; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); z-index: 999; display: none; overflow: hidden; }
  .chat-panel.open { display: flex; flex-direction: column; }
  .chat-header { background: {{PRIMARY_COLOR}}; color: #fff; padding: 16px 20px; font-weight: 700; }
  .chat-messages { flex: 1; padding: 16px; min-height: 200px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .chat-bubble { background: #f3f4f6; padding: 10px 14px; border-radius: 10px; font-size: .9rem; max-width: 85%; }
  .chat-bubble.bot { align-self: flex-start; }
  .chat-input-row { display: flex; border-top: 1px solid #e5e7eb; }
  .chat-input-row input { flex: 1; padding: 12px 16px; border: none; outline: none; font-size: .9rem; font-family: inherit; }
  .chat-input-row button { background: {{PRIMARY_COLOR}}; color: #fff; border: none; padding: 12px 16px; cursor: pointer; }
</style>
<div class="chat-fab" onclick="document.querySelector('.chat-panel').classList.toggle('open')">💬</div>
<div class="chat-panel">
  <div class="chat-header">Chat met {{COMPANY_NAME}}</div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-bubble bot">Hallo! Hoe kan ik u helpen?</div>
  </div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="Stel een vraag..." onkeypress="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">→</button>
  </div>
</div>
<script>
function sendChat() {
  const input = document.getElementById('chatInput');
  const msgs = document.getElementById('chatMessages');
  if (!input.value.trim()) return;
  msgs.innerHTML += '<div class="chat-bubble" style="align-self:flex-end;background:#e0e7ff">' + input.value + '</div>';
  msgs.innerHTML += '<div class="chat-bubble bot">Bedankt voor uw vraag! Stuur ons een email op {{EMAIL}} voor een uitgebreid antwoord.</div>';
  input.value = '';
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
